---
- hosts: localhost
  pre_tasks:
    - name: Set image name
      set_fact:
        image_name: "ubuntu-image"
      tags: always

- import_playbook: imports/anarchy-ubuntu-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    image_password:

- import_playbook: imports/anarchy-ubuntu-image-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['image_name'] }}.osimages.xcat"

- hosts:
    - "{{ hostvars['localhost']['image_name'] }}.osimages.xcat"
  roles: []

- hosts: controllers
  roles:
    - role: anarchy/osimage-pack
      vars:
        image_name: "{{ hostvars['localhost']['image_name'] }}"
      tags: pack-images
