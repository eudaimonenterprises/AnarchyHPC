#      slurm_conf_path: '{{ shared_data }}/etc/slurm'
#      slurm_spool_path: '{{ shared_data }}/var/spool/slurm'
#      munge_conf_path: '{{ shared_data }}/etc/munge'
#      tags: slurm


- hosts: controllers
  roles:
    - role: anarchy/pack-images
      vars:
        params:
          image_name: "{{ hostvars['localhost']['image_name'] }}"
      tags: pack-images
