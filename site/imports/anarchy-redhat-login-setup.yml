---
- hosts: "{{ hostlist }}"
  become: true

  vars:
    anarchy_ctrl_hostname: "controller1"
    controller_ip: "10.0.0.1"
    anarchy_domain: "cluster.local"

    nfs_home: "/home"
    nfs_shared: "/shared"

    enable_openhpc: false
    enable_easybuild: false
    enable_ood: true
    enable_prometheus: true

  pre_tasks:
    - name: Show in_login_image fact
      debug:
        msg: "in_login_image: {{ in_login_image | default(false) }}"
      tags: always

  roles:
    # Facts
    - role: ansible.builtin.setup
      tags: always

    # Basic packages, ssh, firewall, chrony
    - role: geerlingguy.repo-epel
    - role: geerlingguy.firewall
      firewall_allowed_tcp_ports:
        - 22
        - 111
        - 2049
        - 443
        - 6817
        - 6818
        - 6819
      tags: firewalld

    - role: geerlingguy.chrony
      chrony_ntp_servers:
        - "{{ anarchy_ctrl_ip }}"
      tags: chrony

    - role: devsec.hardening.ssh_hardening
      tags: ssh

    # Hostname
    - role: geerlingguy.hostname
      hostname: "{{ inventory_hostname }}"
      tags: hostname

    # SSL cert (you can swap this for your own cert management)
    - name: Ensure self-signed cert for login node
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 3650
          -newkey rsa:2048
          -keyout /etc/pki/tls/private/login.key
          -out /etc/pki/tls/certs/login.crt
          -subj "/C=NL/ST=Noord-Holland/L=Amsterdam/O=MyOrg/CN={{ ansible_fqdn }}"
      args:
        creates: /etc/pki/tls/certs/login.crt
      tags: ssl-cert

    # SSSD (LDAP/389ds assumed configured on controller)
    - role: geerlingguy.sssd
      sssd_domains:
        - name: "LDAP"
          ldap_uri: "ldap://{{ anarchy_ctrl_hostname }}.{{ anarchy_domain }}"
          ldap_search_base: "dc=example,dc=com"
      tags: sssd

    # NFS mounts
    - role: geerlingguy.nfs
      nfs_client: true
      nfs_mounts:
        - mount: "{{ nfs_home }}"
          src: "{{ anarchy_ctrl_hostname }}:{{ nfs_home }}"
          opts: "defaults,nfsvers=4,rw,retrans=4,noatime,_netdev"
          state: mounted
        - mount: "{{ nfs_shared }}"
          src: "{{ anarchy_ctrl_hostname }}:{{ nfs_shared }}"
          opts: "defaults,nfsvers=4,ro,retrans=4,_netdev"
          state: mounted
      tags: nfs-mounts

    # Environment modules (optional OpenHPC integration can be added separately)
    - role: geerlingguy.environment-modules
      tags: environment-modules

    # Slurm client on login node
    - role: galaxyproject.slurm
      slurm_role: client
      slurm_controller_host: "{{ anarchy_ctrl_hostname }}"
      when: true
      tags: slurm

    # rsyslog forwarding to controller
    - name: Configure rsyslog forwarding to controller
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.d/10-controller.conf
        create: yes
        block: |
          *.* @@{{ anarchy_ctrl_ip }}:514
      notify: Restart rsyslog
      tags: rsyslog

    # Open OnDemand on login node
    - role: osc.open_ondemand
      ood_port: 443
      ood_auth: "basic_pam"
      when: enable_ood
      tags: ood

    # Prometheus node exporter
    - role: cloudalchemy.node_exporter
      when: enable_prometheus
      tags: prometheus-node-exporter, monitoring

    # Basic logrotate
    - name: Ensure logrotate for system logs
      ansible.builtin.copy:
        dest: /etc/logrotate.d/system-logs
        content: |
          /var/log/messages /var/log/secure /var/log/cron /var/log/maillog {
              weekly
              rotate 4
              compress
              missingok
              notifempty
              sharedscripts
              postrotate
                  /bin/systemctl reload rsyslog.service > /dev/null 2>&1 || true
              endscript
          }
      tags: logrotate

    # Cleanup legacy bits (no vendor cleanup)
    - name: Remove legacy packages
      ansible.builtin.package:
        name:
          - telnet
          - rsh
        state: absent
      tags: cleanup-legacy

  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

  environment:
    no_proxy: ".{{ anarchy_domain }},{{ anarchy_ctrl_ip }}"
    NO_PROXY: ".{{ anarchy_domain }},{{ anarchy_ctrl_ip }}"
  tags: image-setup
