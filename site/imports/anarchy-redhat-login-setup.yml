---
- hosts: "{{ hostlist }}"
  become: true

  vars:
    anarchy_ctrl_hostname: "controller1"
    controller_ip: "10.0.0.1"
    anarchy_domain: "cluster.local"

    nfs_home: "/home"
    nfs_shared: "/shared"

    enable_openhpc: false
    enable_easybuild: false
    enable_ood: true
    enable_prometheus: true

  pre_tasks:
    - name: Show in_login_image fact
      debug:
        msg: "in_login_image: {{ in_login_image | default(false) }}"
      tags: always

  roles:
    # ------------------------------------------------------------
    # Basic system setup
    # ------------------------------------------------------------
    - role: ansible.builtin.setup
      tags: always

    - role: anarchy/packages
      tags: packages

    - role: anarchy/hostname
      tags: hostname

    - role: anarchy/chrony
      tags: chrony

    - role: anarchy/firewalld
      tags: firewalld

    - role: anarchy/ssh
      tags: ssh

    - role: anarchy/pwquality
      tags: pwquality

    - role: anarchy/no_proxy
      tags: no_proxy

    - role: anarchy/resolv
      tags: resolv

    # ------------------------------------------------------------
    # SSL certificate (local self-signed)
    # ------------------------------------------------------------
    - name: Ensure self-signed cert for login node
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 3650
          -newkey rsa:2048
          -keyout /etc/pki/tls/private/login.key
          -out /etc/pki/tls/certs/login.crt
          -subj "/C=NL/ST=Noord-Holland/L=Amsterdam/O=MyOrg/CN={{ ansible_fqdn }}"
      args:
        creates: /etc/pki/tls/certs/login.crt
      tags: ssl-cert

    # ------------------------------------------------------------
    # Authentication (SSSD)
    # ------------------------------------------------------------
    - role: anarchy/sssd
      tags: sssd

    - role: anarchy/nscd
      tags: nscd

    # ------------------------------------------------------------
    # NFS client mounts
    # ------------------------------------------------------------
    - role: anarchy/nfs-mounts
      vars:
        nfs_mounts:
          - mount: "{{ nfs_home }}"
            src: "{{ anarchy_ctrl_hostname }}:{{ nfs_home }}"
            opts: "defaults,nfsvers=4,rw,retrans=4,noatime,_netdev"
            state: mounted
          - mount: "{{ nfs_shared }}"
            src: "{{ anarchy_ctrl_hostname }}:{{ nfs_shared }}"
            opts: "defaults,nfsvers=4,ro,retrans=4,_netdev"
            state: mounted
      tags: nfs-mounts

    # ------------------------------------------------------------
    # Environment modules
    # ------------------------------------------------------------
    - role: anarchy/environment-modules
      tags: environment-modules

    # ------------------------------------------------------------
    # Slurm client
    # ------------------------------------------------------------
    - role: anarchy/slurm
      vars:
        slurm_role: "client"
        slurm_controller_host: "{{ anarchy_ctrl_hostname }}"
      tags: slurm

    - role: anarchy/config-slurm
      tags: slurm

    # ------------------------------------------------------------
    # rsyslog forwarding
    # ------------------------------------------------------------
    - name: Configure rsyslog forwarding to controller
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.d/10-controller.conf
        create: yes
        block: |
          *.* @@{{ controller_ip }}:514
      notify: Restart rsyslog
      tags: rsyslog

    # ------------------------------------------------------------
    # Open OnDemand (login node)
    # ------------------------------------------------------------
    - role: anarchy/nginx
      when: enable_ood
      tags: nginx

    - role: anarchy/ood
      when: enable_ood
      tags: ood

    - role: anarchy/ood-apps
      when: enable_ood
      tags: ood-apps

    # ------------------------------------------------------------
    # Prometheus node exporter
    # ------------------------------------------------------------
    - role: anarchy/prometheus-node-exporter
      when: enable_prometheus
      tags: prometheus-node-exporter

    # ------------------------------------------------------------
    # Logrotate
    # ------------------------------------------------------------
    - role: anarchy/logrotate
      tags: logrotate

  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

  environment:
    no_proxy: ".{{ anarchy_domain }},{{ controller_ip }}"
    NO_PROXY: ".{{ anarchy_domain }},{{ controller_ip }}"
  tags: image-setup
