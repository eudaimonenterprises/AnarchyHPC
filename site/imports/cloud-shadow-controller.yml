---
- hosts: controllers
  become: true

  vars:
    controller_vip: "10.0.0.100"
    controller_nodes:
      - controller1
      - controller2
    cluster_name: "hpc-ha"
    anarchy_dns_forwarders:
      - 8.8.8.8
      - 1.1.1.1

  roles:
    # ------------------------------------------------------------
    # Basic system prep
    # ------------------------------------------------------------
    - role: anarchy/packages
      tags: packages

    - role: anarchy/firewalld
      tags: firewalld

    - role: anarchy/chrony
      tags: chrony

    - role: anarchy/hostname
      tags: hostname

    # ------------------------------------------------------------
    # SSL certificates (self-signed)
    # ------------------------------------------------------------
    - name: Create self-signed SSL certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 3650
        -newkey rsa:2048
        -keyout /etc/pki/tls/private/cluster.key
        -out /etc/pki/tls/certs/cluster.crt
        -subj "/C=NL/ST=Noord-Holland/L=Amsterdam/O=HPC/CN={{ ansible_fqdn }}"
      args:
        creates: /etc/pki/tls/certs/cluster.crt
      tags: ssl-cert

    # ------------------------------------------------------------
    # DNS server (Bind)
    # ------------------------------------------------------------
    - role: anarchy/bind
      vars:
        bind_forwarders: "{{ anarchy_dns_forwarders }}"
      tags: bind

    # ------------------------------------------------------------
    # Pacemaker + Corosync HA stack
    # ------------------------------------------------------------
    - name: Install HA packages
      ansible.builtin.package:
        name:
          - pacemaker
          - corosync
          - pcs
        state: present
      tags: ha

    - name: Enable and start pcsd
      ansible.builtin.service:
        name: pcsd
        state: started
        enabled: true
      tags: ha

    - name: Set hacluster password
      ansible.builtin.command: "echo hacluster:password | chpasswd"
      tags: ha

    - name: Authenticate pcs cluster nodes
      ansible.builtin.command: >
        pcs host auth {{ controller_nodes | join(' ') }}
        -u hacluster -p password
      tags: ha
      run_once: true

    - name: Create HA cluster
      ansible.builtin.command: >
        pcs cluster setup {{ cluster_name }}
        {{ controller_nodes | join(' ') }}
      tags: ha
      run_once: true

    - name: Start and enable HA cluster
      ansible.builtin.command: pcs cluster start --all
      tags: ha
      run_once: true

    - name: Enable cluster services
      ansible.builtin.command: pcs cluster enable --all
      tags: ha
      run_once: true

    # ------------------------------------------------------------
    # Virtual IP for controller failover
    # ------------------------------------------------------------
    - name: Create virtual IP resource
      ansible.builtin.command: >
        pcs resource create ClusterIP ocf:heartbeat:IPaddr2
        ip={{ controller_vip }} cidr_netmask=24 op monitor interval=30s
      tags: ha
      run_once: true

    # ------------------------------------------------------------
    # rsyslog forwarding
    # ------------------------------------------------------------
    - name: Configure rsyslog forwarding
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.d/10-controller.conf
        block: |
          *.* @@{{ controller_vip }}:514
      notify: Restart rsyslog
      tags: rsyslog

  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
