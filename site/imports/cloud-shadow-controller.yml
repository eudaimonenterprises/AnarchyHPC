---
- hosts: controllers
  become: true

  vars:
    controller_vip: "10.0.0.100"
    controller_nodes:
      - controller1
      - controller2
    cluster_name: "hpc-ha"
    dns_forwarders:
      - 8.8.8.8
      - 1.1.1.1

  roles:
    # Basic system prep
    - role: geerlingguy.repo-epel
    - role: geerlingguy.firewall
      firewall_allowed_tcp_ports:
        - 22
        - 111
        - 2049
        - 3121
        - 5405
        - 21064
        - 53
        - 514
      tags: firewalld

    - role: geerlingguy.chrony
      chrony_ntp_servers:
        - "{{ controller_nodes[0] }}"
      tags: chrony

    - role: geerlingguy.hostname
      hostname: "{{ inventory_hostname }}"
      tags: hostname

    # SSL certificates (self-signed or real)
    - name: Create self-signed SSL certificate
      command: >
        openssl req -x509 -nodes -days 3650
        -newkey rsa:2048
        -keyout /etc/pki/tls/private/cluster.key
        -out /etc/pki/tls/certs/cluster.crt
        -subj "/C=NL/ST=Noord-Holland/L=Amsterdam/O=HPC/CN={{ inventory_hostname }}"
      args:
        creates: /etc/pki/tls/certs/cluster.crt
      tags: ssl-cert

    # Optional DNS server
    - role: geerlingguy.bind
      bind_forwarders: "{{ dns_forwarders }}"
      bind_listen_ipv4:
        - "any"
      tags: bind

    # Pacemaker + Corosync HA stack
    - name: Install HA packages
      package:
        name:
          - pacemaker
          - corosync
          - pcs
        state: present
      tags: ha

    - name: Enable and start pcsd
      service:
        name: pcsd
        state: started
        enabled: true
      tags: ha

    - name: Set hacluster password
      command: "echo hacluster:password | chpasswd"
      tags: ha

    - name: Authenticate pcs cluster nodes
      command: >
        pcs host auth {{ controller_nodes | join(' ') }}
        -u hacluster -p password
      tags: ha
      run_once: true

    - name: Create HA cluster
      command: >
        pcs cluster setup {{ cluster_name }}
        {{ controller_nodes | join(' ') }}
      tags: ha
      run_once: true

    - name: Start and enable HA cluster
      command: pcs cluster start --all
      tags: ha
      run_once: true

    - name: Enable cluster services
      command: pcs cluster enable --all
      tags: ha
      run_once: true

    # Virtual IP for controller failover
    - name: Create virtual IP resource
      command: >
        pcs resource create ClusterIP ocf:heartbeat:IPaddr2
        ip={{ controller_vip }} cidr_netmask=24 op monitor interval=30s
      tags: ha
      run_once: true

    # rsyslog forwarding
    - name: Configure rsyslog forwarding
      blockinfile:
        path: /etc/rsyslog.d/10-controller.conf
        block: |
          *.* @@{{ controller_vip }}:514
      notify: Restart rsyslog
      tags: rsyslog

  handlers:
    - name: Restart rsyslog
      service:
        name: rsyslog
        state: restarted
