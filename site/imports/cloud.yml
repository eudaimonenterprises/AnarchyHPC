---
- hosts: controllers
  roles:
    - role: anarchy/prepare
      stage: "controller"

- name: Cloud Support
  hosts: controllers
  gather_facts: true
  tasks:

    - name: Calling init
      include_role:
        name: "anarchy/init"
      when: cloud_support is not defined

    - name: Set cloud_condition fact
      set_fact:
        cloud_condition: >-
          {{ cloud_support
             | map('regex_replace', '^(.*)$', '\1_cloud')
             | map('extract', vars)
             | select('equalto', true)
             | list
             | length > 0 }}

    - block:

        # ---------------------------------------------------------
        # LOAD CLOUD VARIABLES
        # ---------------------------------------------------------

        - name: Include Cloud variables
          include_vars: "group_vars/{{ item }}.yml"
          loop: "{{ vars.cloud_support }}"
          when: vars[item + '_cloud'] | default(false)

        - name: Set IAC fact
          set_fact:
            terraform_installer: >-
              {{ vars | dict2items
                       | selectattr('key', 'search', '_installer')
                       | map(attribute='value')
                       | select('equalto', 'terraform')
                       | list
                       | length > 0 }}

        # ---------------------------------------------------------
        # EXTERNAL IP DISCOVERY
        # ---------------------------------------------------------

        - block:
            - name: Resolving AS external IP address
              uri:
                url: "https://ipinfo.io/json"
              register: cloud_local_external_as_ip_info

            - name: Setting external AS IP address
              set_fact:
                cloud_local_external_as_ip: "{{ cloud_local_external_as_ip_info.json.ip }}"
              when: cloud_local_external_as_ip_info.status | default(0) | int == 200
          when: cloud_local_external_as_ip is not defined

        - debug:
            msg: "cloud_local_external_as_ip: {{ cloud_local_external_as_ip }}"

        # ---------------------------------------------------------
        # iPXE IMAGE BUILD
        # ---------------------------------------------------------

        - name: Verifying if iPXE uEFI image has already been built
          stat:
            path: /etc/anarchy/cloud-image.done
          register: cloud_uefi_image_done

        - block:
            - name: Build iPXE uEFI file for GRUB Booting
              include_role:
                name: "cloud/ipxe"
              vars:
                skip_ipxe_efi_build: true

            - name: Signing iPXE uEFI image creation off
              copy:
                content: ""
                dest: /etc/anarchy/cloud-image.done
          when: not cloud_uefi_image_done.stat.exists

        # ---------------------------------------------------------
        # CLOUD PHASE ONE
        # ---------------------------------------------------------

        - name: Verifying if cloud phase one already done
          stat:
            path: /etc/anarchy/cloud-phaseone.done
          register: cloud_phaseone_done

        - block:

            # ---------------------------------------------------------
            # PSK SECRET HANDLING
            # ---------------------------------------------------------

            - name: Verify if psk secret exists
              stat:
                path: /etc/anarchy/passwords/psk/vpn.txt
              register: cloud_psk_secret_file

            - block:
                - name: Ensure secure psk directory exists
                  file:
                    path: /etc/anarchy/passwords/psk
                    state: directory

                - name: Create psk secret
                  shell: "head -c 32 /dev/urandom | base64"
                  register: cloud_base64_psk_data

                - name: Storing psk secret
                  copy:
                    content: "{{ cloud_base64_psk_data.stdout }}"
                    dest: /etc/anarchy/passwords/psk/vpn.txt
                    mode: 0640
                    owner: root
                    group: root
                  when: cloud_base64_psk_data.rc | int == 0
              when: not cloud_psk_secret_file.stat.exists

            - name: Read PSK secret
              become: true
              command: cat /etc/anarchy/passwords/psk/vpn.txt
              register: cloud_psk_secret_cmd
              changed_when: false

            - set_fact:
                cloud_psk_secret: "{{ cloud_psk_secret_cmd.stdout }}"

            # ---------------------------------------------------------
            # SSH KEY HANDLING
            # ---------------------------------------------------------

            - name: Read controller public key
              become: true
              command: cat /root/.ssh/id_rsa.pub
              register: controller_pubkey
              changed_when: false

            - set_fact:
                cloud_ssh_public_key: "{{ controller_pubkey.stdout }}"
            # ---------------------------------------------------------
            # CLOUD ROLE EXECUTION
            # ---------------------------------------------------------

            - name: Include Cloud Role and Install IAC approach
              include_role:
                name: "cloud/{{ item }}"
              vars:
                vpn_psk_secret: "{{ cloud_psk_secret }}"
                terraform_files: "{{ anarchy_local }}/terraform/{{ item }}"
                ssh_public_key_access: "{{ cloud_ssh_public_key }}"
                on_premise_controller_ip: "{{ anarchy_ctrl_ip }}"
                include_ipxe_efi_build: true
              loop: "{{ vars.cloud_support }}"
              when: vars[item + '_cloud'] | default(false)

            # ---------------------------------------------------------
            # TERRAFORM HANDLING
            # ---------------------------------------------------------

            - name: Verifying if terraform already done
              stat:
                path: /etc/anarchy/cloud-terraform.done
              register: cloud_terraform_done

            - block:
                - name: Run Terraform playbook Stage one
                  include_role:
                    name: "cloud/terraform"
                  vars:
                    cloudname: "{{ cloud_item }}"
                    terraform_files: "{{ anarchy_local }}/terraform/{{ cloud_item }}"
                  loop: "{{ vars.cloud_support }}"
                  loop_control:
                    loop_var: cloud_item
                  when:
                    - terraform_installer
                    - vars[cloud_item + '_cloud'] | default(false)

                - name: Signing terraform off
                  copy:
                    content: ""
                    dest: /etc/anarchy/cloud-terraform.done
              when: not cloud_terraform_done.stat.exists

            # ---------------------------------------------------------
            # TERRAFORM VARIABLE EXTRACTION
            # ---------------------------------------------------------

            - name: Read terraform variables file
              become: true
              slurp:
                src: "{{ anarchy_local }}/terraform/{{ cloud_item }}/variables.dat"
              register: terraform_vars_raw
              loop: "{{ vars.cloud_support }}"
              loop_control:
                loop_var: cloud_item
              when: vars[cloud_item + '_cloud'] | default(false)

            - name: Extract VPN remote IP
              set_fact:
                "{{ cloud_item + '_obtained_remote_ip' }}": >-
                  {{
                    (
                      terraform_vars_raw.results
                      | selectattr('item', 'equalto', cloud_item)
                      | map(attribute='content')
                      | map('b64decode')
                      | map('splitlines')
                      | first
                    )
                    | regex_findall(cloud_vpn_namekey[cloud_item] ~ ' = \"[0-9\\.]+\"')
                    | first
                    | regex_findall('[0-9]+\\.[0-9\\.]+')
                    | first
                  }}
              loop: "{{ vars.cloud_support }}"
              loop_control:
                loop_var: cloud_item
              when: vars[cloud_item + '_cloud'] | default(false)

            - name: Extract VPN remote PSK (AWS only)
              set_fact:
                "{{ cloud_item + '_obtained_remote_psk' }}": >-
                  {{
                    (
                      terraform_vars_raw.results
                      | selectattr('item', 'equalto', cloud_item)
                      | map(attribute='content')
                      | map('b64decode')
                      | map('splitlines')
                      | first
                    )
                    | regex_findall(cloud_vpn_pskkey[cloud_item] ~ ' = \".[^\\\"]+\"')
                    | first
                    | regex_findall('\".+\"')
                    | first
                    | regex_findall('[a-zA-Z0-9_\\.]+')
                    | first
                  }}
              loop: "{{ vars.cloud_support }}"
              loop_control:
                loop_var: cloud_item
              when:
                - cloud_item == 'aws'
                - vars[cloud_item + '_cloud'] | default(false)

            # ---------------------------------------------------------
            # VPN CONFIGURATION
            # ---------------------------------------------------------

            - name: Calling VPN role
              include_role:
                name: "vpn/strongswan"
              vars:
                vpn_connection_name: "{{ vars[cloud_item + '_vpn_connection_name'] }}"
                vpn_remote_public_ip: "{{ vars[cloud_item + '_obtained_remote_ip'] }}"
                vpn_local_external_ip: "{{ controller_external_ip }}"
                vpn_local_private_subnet: "{{ anarchy_cluster_net }}/{{ anarchy_cluster_netprefix }}"
                vpn_remote_private_subnet: "{{ vars[cloud_item + '_cluster_net'] }}/{{ vars[cloud_item + '_cluster_netprefix'] }}"
                vpn_psk_secret: "{{ vars[cloud_item + '_obtained_remote_psk'] | default(cloud_psk_secret) }}"
                vpn_template: "{{ cloud_item }}"
              loop: "{{ vars.cloud_support }}"
              loop_control:
                loop_var: cloud_item
              when: vars[cloud_item + '_obtained_remote_ip'] is defined

            - name: Signing cloud phase one off
              copy:
                content: ""
                dest: /etc/anarchy/cloud-phaseone.done

          when: not cloud_phaseone_done.stat.exists

        # ---------------------------------------------------------
        # CLOUD PHASE TWO
        # ---------------------------------------------------------

        - name: Verifying if cloud phase two already done
          stat:
            path: /etc/anarchy/cloud-phasetwo.done
          register: cloud_phasetwo_done

        - block:

            - name: Include cluster cloud configuration
              include_role:
                name: "cloud/cluster"
              vars:
                createnodes: "{{ vars[cloud_item + '_node'] | default(false) }}"
                rawhostlist: "{{ vars[cloud_item + '_nodes'] | default('') }}"
                cloudname: "{{ cloud_item }}"
                cloudtype: "{{ cloud_item }}"
                network: "{{ vars[cloud_item + '_cluster_net'] }}/{{ vars[cloud_item + '_cluster_netprefix'] }}"
                dhcprange: "{{ vars[cloud_item + '_cluster_dhcp_start'] | default('') }}-{{ vars[cloud_item + '_cluster_dhcp_end'] | default('') }}"
                domain: "{{ vars[cloud_item + '_domain'] | default('cluster-' + cloud_item) }}"
              loop: "{{ vars.cloud_support }}"
              loop_control:
                loop_var: cloud_item
              when: vars[cloud_item + '_cloud'] | default(false)

            - name: Include cloud controller installer
              include_role:
                name: "cloud/controller"
              vars:
                cloudname: "{{ cloud_item }}"
                controller: "{{ vars[cloud_item + '_ctrl_ip'] }}"
              loop: "{{ vars.cloud_support }}"
              loop_control:
                loop_var: cloud_item
              when: vars[cloud_item + '_cloud'] | default(false)

            - name: Signing cloud phase two off
              copy:
                content: ""
                dest: /etc/anarchy/cloud-phasetwo.done

          when: not cloud_phasetwo_done.stat.exists

      when: cloud_condition

  environment:
    no_proxy: ".{{ anarchy_domain }},{{ anarchy_ctrl_ip }},{{ anarchy_external_fqdn }},{{ anarchy_ctrl_hostname }},{{ anarchy_ctrl1_hostname }},{{ anarchy_ctrl2_hostname }}"
    NO_PROXY: ".{{ anarchy_domain }},{{ anarchy_ctrl_ip }},{{ anarchy_external_fqdn }},{{ anarchy_ctrl_hostname }},{{ anarchy_ctrl1_hostname }},{{ anarchy_ctrl2_hostname }}"
