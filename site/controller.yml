---
- name: Configure HPC Controller Node
  hosts: controllers
  become: yes

  roles:

    # ------------------------------------------------------------
    # SSH (REQUIRED FOR CONTROLLER KEYS)
    # ------------------------------------------------------------
    - anarchy/ssh

    # ------------------------------------------------------------
    # Core bootstrap
    # ------------------------------------------------------------
    - anarchy/prepare
    - anarchy/init
    - anarchy/packages
    - anarchy/hostname
    - anarchy/chrony
    - anarchy/firewalld
    - anarchy/pwquality
    - anarchy/no_proxy
    - anarchy/resolv
    - anarchy/ssl-cert
    - anarchy/environment
    - anarchy/openhpc
    - anarchy/environment-modules
    - anarchy/tunables
    - anarchy/logrotate

    # ------------------------------------------------------------
    # High Availability (must run before any service roles)
    # ------------------------------------------------------------
    - anarchy/pacemaker

    # ------------------------------------------------------------
    # Identity & Authentication
    # ------------------------------------------------------------
    - anarchy/ldap-backend-selector
    - anarchy/openldap        # You selected OpenLDAP
    - anarchy/obol            # This must be installed before sssd
    - anarchy/sssd
    - anarchy/nscd
    - anarchy/password

    # ------------------------------------------------------------
    # Networking & Provisioning (xCAT stack)
    # ------------------------------------------------------------
    - anarchy/bind            # DNS
    - anarchy/kea             # DHCP
    - anarchy/apache          # Replaces anarchy/nginx
    - anarchy/xcat            # Provisioning
    - anarchy/image-create
    - anarchy/image-download
    - anarchy/target
    - anarchy/config-genders
    - anarchy/config-manager
    - anarchy/lock-check
    - anarchy/check-latest-kernel


    # ------------------------------------------------------------
    # Storage & Shared Filesystems
    # ------------------------------------------------------------
    - anarchy/nfs             # NFS exports
    - anarchy/shared-fs
    - anarchy/anarchy-tree

    # ------------------------------------------------------------
    # Slurm Controller
    # ------------------------------------------------------------
    - anarchy/slurm
    - anarchy/config-slurm
    - anarchy/slurm-sbank
    - anarchy/rdma-centos     # Optional but common for HPC fabrics

    # ------------------------------------------------------------
    # Monitoring Stack (Prometheus + Grafana)
    # ------------------------------------------------------------
    - anarchy/prometheus-server
    - anarchy/prometheus-alertmanager
    - anarchy/prometheus-slurm-exporter
    - anarchy/prometheus-slurm-job-exporter
    - anarchy/prometheus-lshw-exporter
    - anarchy/prometheus-ipmi-exporter
    - anarchy/prometheus-infiniband-exporter
    - anarchy/prometheus-ha-exporter
    - anarchy/grafana

    # ------------------------------------------------------------
    # Open OnDemand
    # ------------------------------------------------------------
    - anarchy/ood
    - anarchy/ood-apps

    # ------------------------------------------------------------
    # Logging
    # ------------------------------------------------------------
    - anarchy/rsyslog         # or anarchy/syslog-ng if preferred
    - anarchy/wrapup
    - anarchy/wrapup-images

    # ------------------------------------------------------------
    # Optional HPC stacks (enable if needed)
    # ------------------------------------------------------------
    # - anarchy/easybuild
    # - anarchy/pbspro
    # - anarchy/kubernetes
