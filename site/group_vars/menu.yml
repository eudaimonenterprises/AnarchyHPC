## ----------- Instructions -------------
## Types(additional entries): [text(limit), ip(check_network, limit[TBA]), network(limit[TBA]), dropdown(choices), bool, list(limit), int(limit), subnet]
## General additional entries:
## (ha) can be an additional entry for all entries: If all.yml HA is false and elem[HA] is true, then it won't show. and vice versa
## (pseudo) can be an additional entry for all entries: Displays a pseudonym that might be more descriptive
## (seperator) can be an additional entry for all entries: Adds a "------" dashed seperator between this field and the one that follows
## (description) can be an additional entry for all entries: Adds a description text before each field
## Restrictions: 
## 1- One element (and one element only) has to be a network. The network must be present. Has to be of type Network
## 2- The element trix_cluster_netprefix has to be present as well. Has to be of type subnet
## 3- Do not attempt to add el8_openhpc_repositories
## 4- The "High Availability" menu has to remain being called "High Availability".
## Note:
## The SharedFSDisk will only show up if the "High Availability" menu is there
---
Cluster config:
  cluster_domain:
    type: text
    big_seperator: true
    description: "The internal domain used for cluster nodes and controllers"

  cluster_network:
    type: network
    description: "Cluster's internal network"

  cluster_netmask:
    type: subnet
    seperator: true

  cluster_dhcp_start:
    type: ip
    check_network: true

  cluster_dhcp_end:
    type: ip
    check_network: true
    big_seperator: true

  controller_primary_ip:
    description: (First) controller
    type: ip
    check_network: true

  controller_primary_hostname:
    type: text
    seperator: true

  controller_secondary_ip:
    description: Second controller
    type: ip
    ha: true
    check_network: true

  controller_secondary_hostname:
    type: text
    ha: true
    seperator: true

  controller_floating_ip:
    description: Controller floating/shared IP for HA
    type: ip
    check_network: true
    ha: true

  controller_floating_hostname:
    type: text
    ha: true


High Availability:
  enable_ipmilan_fencing:
    type: bool

  controller_primary_bmcip:
    type: ip
    enable_ipmilan_fencing: true

  controller_secondary_bmcip:
    type: ip
    enable_ipmilan_fencing: true

  fence_ipmilan_login:
    type: text

  fence_ipmilan_passwd:
    type: text
    seperator: true

  enable_heartbeat_link:
    type: bool

  controller_primary_heartbeat_ip:
    type: ip
    enable_heartbeat_link: true

  controller_secondary_heartbeat_ip:
    type: ip
    enable_heartbeat_link: true
    seperator: true

  shared_fs_prefix:
    type: text


Additional Networks:
  infiniband_network:
    type: ip

  infiniband_netmask:
    type: text
    seperator: true

  bmc_network:
    type: ip

  bmc_netmask:
    type: text


Network general config:
  external_fqdn:
    description: "External hostname of the controller. If undefined, uses controller FQDN."
    type: text

  dns_forwarders:
    type: list
    seperator: true

  resolv_search_domains:
    type: text
    seperator: true

  firewalld_public_interfaces:
    type: list

  firewalld_trusted_interfaces:
    type: list

  firewalld_public_tcp_ports:
    type: list

  firewalld_public_udp_ports:
    type: list
    seperator: true


Authentication config:
  enable_authentication:
    type: bool
    seperator: true

  ldap_backend:
    type: dropdown
    choices: ['openldap','ds389']
    seperator: true

  admin_group:
    type: text
    seperator: true


SSL config:
  ssl_cert_path:
    type: text

  ssl_ca_cert:
    type: text

  ssl_ca_key:
    type: text

  ssl_cert_group:
    type: text
    seperator: true


Workload Manager:
  workload_manager:
    type: list

  enable_slurm_pam:
    type: bool


Open Ondemand:
  enable_ood:
    type: bool

  ood_authentication_provider:
    type: dropdown
    choices: ["dex", "pam"]

  ood_enable_interactive_apps:
    type: list
    limit: 256


Misc:
  image_default_target:
    type: dropdown
    choices: ["multi-user", "graphical"]

  additional_env_modules:
    type: list
    seperator: true

  enable_openhpc:
    type: bool
    seperator: true

  enable_easybuild:
    type: bool

  export_easybuild:
    type: dropdown
    choices: ['rw', 'ro']
    seperator: true

  enable_selinux:
    type: bool
