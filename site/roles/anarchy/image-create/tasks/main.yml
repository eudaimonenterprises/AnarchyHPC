---
- block:
    - name: Load OS‑specific controller variables
      include_vars: "{{ package_arch | default('x86_64') }}/controller-{{ image_create_distribution | default('ubuntu') }}.yaml"
      no_log: false
      ignore_errors: true

    - name: Get image path
      set_fact:
        image_path: "{{ anarchy_images | default('/install/images') }}/{{ image_name | default('placeholder') }}"

    - name: Create dir for compute image
      file:
        path: "{{ image_path }}"
        state: directory

    - debug:
        msg: "------------------------- image_create / base -------------------------"

    - name: Creating base image
      ansible.builtin.include_tasks:
        file: "{{ image_create_distribution | default('ubuntu') }}/base.yml"
      when: image_create_minimal | default(True)

    - debug:
        msg: "------------------------- image_create / extend -------------------------"

    - name: Extending base image
      ansible.builtin.include_tasks:
        file: "{{ image_create_distribution | default('ubuntu') }}/extend.yml"
      when: image_create_full | default(True)
  when: not in_image | default(false)

- block:
    - block:
        - debug:
            msg: "------------------------- image_create / from scratch or osgrab -------------------------"

        - name: Tasks inside image
          ansible.builtin.include_tasks:
            file: "{{ image_create_distribution | default('ubuntu') }}/osgrab.yml"
      when: image_extend_osgrab | default(False) or image_extend_scratch | default(False)

    - block:
        - debug:
            msg: "------------------------- image_create / docker -------------------------"

        - name: Tasks inside image
          ansible.builtin.include_tasks:
            file: "{{ image_create_distribution | default('ubuntu') }}/docker.yml"
      when: image_extend_docker | default(False)

    - debug:
        msg: "------------------------- image_create / finished -------------------------"
  when: in_image | default(false)
