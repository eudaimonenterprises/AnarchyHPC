---
- name: Load OS‑specific variables
  include_vars: "{{ package_arch }}/image-{{ image_create_distribution }}.yaml"
  no_log: false
  ignore_errors: true

# ---------------------------------------------------------
# Install required packages on the controller
# ---------------------------------------------------------
- name: Install required packages (controller)
  zypper:
    name: "{{ required_packages }}"
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

# ---------------------------------------------------------
# Prepare image directory structure
# ---------------------------------------------------------
- name: Prepare paths in image
  file:
    path: "{{ image_path }}/{{ item }}"
    state: directory
  loop:
    - etc/zypp/repos.d
    - var/lib/rpm
    - etc/pki/rpm-gpg
    - dev/pts

# ---------------------------------------------------------
# Copy repo definition into the image
# ---------------------------------------------------------
- name: Configure openSUSE repositories
  template:
    src: opensuse-repo.j2
    dest: "{{ image_path }}/etc/zypp/repos.d/opensuse.repo"

# ---------------------------------------------------------
# Initialize RPM DB
# ---------------------------------------------------------
- name: Initialize the rpm DB
  command: "rpm --root {{ image_path }} --initdb"

# ---------------------------------------------------------
# Copy GPG key
# ---------------------------------------------------------
- name: Copy the rpm gpg key to the image
  copy:
    src: /usr/share/distribution-gpg-keys/opensuse/RPM-GPG-KEY-openSUSE
    dest: "{{ image_path }}/etc/pki/rpm-gpg/"

# ---------------------------------------------------------
# Bootstrap the image using zypper --root
# ---------------------------------------------------------
- name: Install bootstrap packages in image
  command: >
    zypper --non-interactive --root {{ image_path }}
    --gpg-auto-import-keys install {{ item }}
  loop: "{{ image_bootstrap_packages }}"
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

# ---------------------------------------------------------
# Install base system pattern
# ---------------------------------------------------------
- name: Install base pattern in image
  command: >
    zypper --non-interactive --root {{ image_path }}
    install -t pattern base

# ---------------------------------------------------------
# Create /dev nodes
# ---------------------------------------------------------
- name: Create /dev directory
  file:
    path: "{{ image_path }}/dev"
    state: directory
    mode: 0755

- name: Create basic /dev files
  command: "/usr/bin/mknod {{ image_path }}/dev/{{ item.dev }} {{ item.t }} {{ item.ma }} {{ item.mi }}"
  args:
    creates: "{{ image_path }}/dev/{{ item.dev }}"
  loop:
    - {dev: "null",      t: 'c', ma: 1,   mi: 3}
    - {dev: "zero",      t: 'c', ma: 1,   mi: 5}
    - {dev: "random",    t: 'c', ma: 1,   mi: 8}
    - {dev: "urandom",   t: 'c', ma: 1,   mi: 9}
    - {dev: "console",   t: 'c', ma: 5,   mi: 1}
    - {dev: "ptmx",      t: 'c', ma: 5,   mi: 2}
    - {dev: "tty",       t: 'c', ma: 5,   mi: 0}

- name: Create /dev/fd symlink
  file:
    src: /proc/self/fd
    dest: "{{ image_path }}/dev/fd"
    state: link
    force: true
