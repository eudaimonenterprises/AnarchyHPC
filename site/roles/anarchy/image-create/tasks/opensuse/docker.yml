---
- name: Load OS‑specific variables
  include_vars: "{{ package_arch }}/docker-{{ image_create_distribution }}.yaml"

# ---------------------------------------------------------
# Prepare directory structure
# ---------------------------------------------------------
- name: Prepare paths in image
  file:
    path: "/{{ item }}"
    state: directory
  loop:
    - etc/zypp/repos.d
    - var/lib/rpm
    - etc/pki/rpm-gpg
    - dev/pts

# ---------------------------------------------------------
# Create /dev and device nodes
# ---------------------------------------------------------
- name: Create /dev
  file:
    path: /dev
    state: directory
    mode: 0755

- name: Create basic /dev files
  command: "/usr/bin/mknod /dev/{{ item.dev }} {{ item.t }} {{ item.ma }} {{ item.mi }}"
  args:
    creates: "/dev/{{ item.dev }}"
  loop:
    - {dev: "null",    t: 'c', ma: 1,   mi: 3}
    - {dev: "zero",    t: 'c', ma: 1,   mi: 5}
    - {dev: "random",  t: 'c', ma: 1,   mi: 8}
    - {dev: "urandom", t: 'c', ma: 1,   mi: 9}
    - {dev: "console", t: 'c', ma: 5,   mi: 1}
    - {dev: "ptmx",    t: 'c', ma: 5,   mi: 2}
    - {dev: "tty",     t: 'c', ma: 5,   mi: 0}

- name: Create /dev/fd symlink
  file:
    src: /proc/self/fd
    dest: /dev/fd
    state: link
    force: true

# ---------------------------------------------------------
# GPG keys
# ---------------------------------------------------------
- name: Copy the rpm gpg key to the image
  copy:
    src: /usr/share/distribution-gpg-keys/opensuse/RPM-GPG-KEY-openSUSE
    dest: /etc/pki/rpm-gpg/

# ---------------------------------------------------------
# Configure AnarchyHPC repos (openSUSE style)
# ---------------------------------------------------------
- name: Write AnarchyHPC repo files
  template:
    src: opensuse-repo.j2
    dest: "/etc/zypp/repos.d/{{ item.name }}.repo"
  loop: "{{ anarchyhpc_repositories }}"
  when: item.name is defined
  tags: repos

# ---------------------------------------------------------
# Refresh repos and update
# ---------------------------------------------------------
- name: Refresh repositories
  command: "zypper --non-interactive --gpg-auto-import-keys refresh"

- name: Update system
  command: "zypper --non-interactive up --replacefiles"

# ---------------------------------------------------------
# Install core packages
# ---------------------------------------------------------
- name: Install core packages
  zypper:
    name: "{{ item }}"
    state: present
  loop: "{{ image_core_packages }}"
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  ignore_errors: true

# ---------------------------------------------------------
# Reinstall packages (if needed)
# ---------------------------------------------------------
- name: Reinstall packages
  zypper:
    name: "{{ item }}"
    state: present
    force: true
  loop: "{{ image_reinstall_packages }}"
  ignore_errors: true

# ---------------------------------------------------------
# Enable services
# ---------------------------------------------------------
- name: Enabling services
  service:
    name: "{{ item }}"
    enabled: true
  loop:
    - NetworkManager
    - sshd
  ignore_errors: true
