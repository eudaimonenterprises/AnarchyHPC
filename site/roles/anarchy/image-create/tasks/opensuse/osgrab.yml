---
- name: Load OS‑specific variables
  include_vars: "{{ package_arch }}/image-{{ image_create_distribution }}.yaml"
  no_log: false
  ignore_errors: true

# ---------------------------------------------------------
# Configure AnarchyHPC repos (openSUSE style)
# ---------------------------------------------------------
- name: Write AnarchyHPC repo files
  template:
    src: opensuse-repo.j2
    dest: "/etc/zypp/repos.d/{{ item.name }}.repo"
  loop: "{{ anarchyhpc_repositories }}"
  when: item.name is defined
  tags: repos

# ---------------------------------------------------------
# Prepare zypper
# ---------------------------------------------------------
- name: Refresh repositories
  command: "zypper --non-interactive --gpg-auto-import-keys refresh"

# ---------------------------------------------------------
# Install core packages
# ---------------------------------------------------------
- name: Install core packages
  zypper:
    name: "{{ item }}"
    state: present
  loop: "{{ image_core_packages }}"
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

# ---------------------------------------------------------
# Enable services
# ---------------------------------------------------------
- name: Enabling services
  service:
    name: "{{ item }}"
    enabled: true
  loop:
    - NetworkManager
    - sshd
  ignore_errors: true
