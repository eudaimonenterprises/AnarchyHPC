---
# Cross‑platform firewalld controller role

###############################################################################
# 1. Validate interface existence
###############################################################################

- name: Verify if interfaces in firewalld_trusted_interfaces exist
  fail:
    msg: "NOTE: interface {{ item }} defined in trusted zone but it does not exist"
  when: hostvars[inventory_hostname]['ansible_' + item] is not defined
  loop: "{{ firewalld_trusted_interfaces }}"
  ignore_errors: true

- name: Verify if interfaces in firewalld_public_interfaces exist
  fail:
    msg: "NOTE: interface {{ item }} defined in public zone but it does not exist"
  when: hostvars[inventory_hostname]['ansible_' + item] is not defined
  loop: "{{ firewalld_public_interfaces }}"
  ignore_errors: true


###############################################################################
# 2. Render helper script
###############################################################################

- name: Render interface and zone mismatches fix script
  template:
    src: 'fix-firewalld-zones.sh.j2'
    dest: '/tmp/fix-firewalld-zones.sh'
    mode: 0750


###############################################################################
# 3. Install firewalld (OS‑specific)
###############################################################################

# SUSE
- name: Install firewalld packages on SUSE
  zypper:
    name: "{{ firewalld_packages }}"
    state: present
  when: ansible_os_family == "Suse"
  tags: install-only

# RHEL / Rocky / Alma
- name: Install firewalld packages on RHEL-family
  yum:
    name: "{{ firewalld_packages }}"
    state: present
  when: ansible_os_family == "RedHat"
  tags: install-only
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

# Debian / Ubuntu
- name: Install firewalld packages on Debian-family
  apt:
    name: "{{ firewalld_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  tags: install-only


###############################################################################
# 4. Start and enable firewalld
###############################################################################

- name: Start and enable firewalld service
  service:
    name: firewalld
    state: started
    enabled: yes


###############################################################################
# 5. Assign interfaces to zones
###############################################################################

- name: Assign interfaces to the public zone
  firewalld:
    zone: public
    interface: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewalld_public_interfaces }}"
  notify: reload firewalld


# SUSE does NOT use /etc/sysconfig/network-scripts
- name: Update ifcfg files for public interfaces (RHEL only)
  lineinfile:
    path: "/etc/sysconfig/network-scripts/ifcfg-{{ item }}"
    regexp: '^ZONE='
    line: 'ZONE=public'
    create: true
  loop: "{{ firewalld_public_interfaces }}"
  when:
    - firewalld_update_ifcfg_files
    - ansible_os_family == "RedHat"


###############################################################################
# 6. Trusted zone
###############################################################################

- name: Add controller internal interface to trusted zone
  set_fact:
    firewalld_trusted_interfaces: "{{ [anarchy_ctrl_interface] + firewalld_trusted_interfaces }}"
  when: anarchy_ctrl_interface is defined and anarchy_ctrl_interface != ""

- name: Assign interfaces to the trusted zone
  firewalld:
    zone: trusted
    interface: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewalld_trusted_interfaces | unique }}"
  notify: reload firewalld

- name: Update ifcfg files for trusted interfaces (RHEL only)
  lineinfile:
    path: "/etc/sysconfig/network-scripts/ifcfg-{{ item }}"
    regexp: '^ZONE='
    line: 'ZONE=trusted'
    create: true
  loop: "{{ firewalld_trusted_interfaces | unique }}"
  when:
    - firewalld_update_ifcfg_files
    - ansible_os_family == "RedHat"


###############################################################################
# 7. Masquerading
###############################################################################

- name: Enable masquerading on the '{{ firewalld_masquerade_zone }}' zone
  firewalld:
    zone: "{{ firewalld_masquerade_zone }}"
    masquerade: yes
    state: enabled
    permanent: true
    immediate: true
  when: firewalld_masquerade_zone is defined


###############################################################################
# 8. Open ports
###############################################################################

- name: Configure open TCP ports on the public zone
  firewalld:
    zone: public
    port: "{{ item }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewalld_public_tcp_ports }}"

- name: Configure open UDP ports on the public zone
  firewalld:
    zone: public
    port: "{{ item }}/udp"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ firewalld_public_udp_ports }}"


###############################################################################
# 9. Direct rules
###############################################################################

- name: Add direct rules
  template:
    src: 'direct-rules.xml.j2'
    dest: '/etc/firewalld/direct.xml'
  when: firewalld_direct_rules is defined
  notify: reload firewalld


###############################################################################
# 10. Apply handlers
###############################################################################

- meta: flush_handlers
