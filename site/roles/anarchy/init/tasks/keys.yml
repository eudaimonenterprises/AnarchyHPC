---
- block:
  - name: Verify if secret vault exists
    stat:
      path: "{{ anarchy_ssl }}/secret.key"
    register: stat_secret_key

  - block:
    - name: Generate secret key
      set_fact:
        luna_secret_key: "{{ lookup('password', '/dev/null length=32 chars=abcdef0123456789') }}"

    - name: Write secret key to vault
      copy:
        dest: "{{ anarchy_ssl }}/secret.key"
        content: "{{ luna_secret_key }}"
    when: not stat_secret_key.stat.exists

  - block:
    - name: Import secret key
      slurp:
        src: "{{ anarchy_ssl }}/secret.key"
      register: luna_secret_key_b64

    - name: Set secret key
      set_fact:
        luna_secret_key: "{{ luna_secret_key_b64['content'] | b64decode }}"
    when: stat_secret_key.stat.exists


- block:
  - name: Verify if omapi vault exists
    stat:
      path: "{{ anarchy_ssl }}/omapi.key"
    register: stat_omapi_key

  - block:
    - name: Generate omapi key
      set_fact:
        omapi_key: "{{ lookup('password', '/dev/null length=32 chars=abcdef0123456789') }}"

    - name: Write omapi key to vault
      copy:
        dest: "{{ anarchy_ssl }}/omapi.key"
        content: "{{ omapi_key }}"
    when: not stat_omapi_key.stat.exists

  - block:
    - name: Import omapi key
      slurp:
        src: "{{ anarchy_ssl }}/omapi.key"
      register: omapi_key_b64

    - name: Set omapi key
      set_fact:
        omapi_key: "{{ omapi_key_b64['content'] | b64decode }}"
    when: stat_omapi_key.stat.exists


- block:
  - name: Verify if TSIG vault exists
    stat:
      path: "{{ anarchy_ssl }}/tsig.key"
    register: stat_tsig_key

  - block:
    - name: Generate TSIG key
      shell: tsig-keygen -a hmac-sha256 tsig-key
      register: raw_tsig_key

    - name: Set TSIG key
      set_fact:
        tsig_key: "{{ raw_tsig_key.stdout }}"

    - name: Write TSIG key to vault
      copy:
        dest: "{{ anarchy_ssl }}/tsig.key"
        content: "{{ tsig_key }}"
    when: not stat_tsig_key.stat.exists

  - block:
    - name: Import TSIG key
      slurp:
        src: "{{ anarchy_ssl }}/tsig.key"
      register: tsig_key_b64

    - name: Set TSIG key
      set_fact:
        tsig_key: "{{ tsig_key_b64['content'] | b64decode }}"
    when: stat_tsig_key.stat.exists

  - name: Set TSIG key secret
    set_fact:
      # We use a default('') here to prevent 'split()' from crashing if regex fails
      tsig_key_secret: >-
        {{ (tsig_key | regex_search('secret\s+\".*\";') | default('')) | split() | last | regex_replace('[\";]', '') }}

  - name: Set TSIG key algo
    set_fact:
      # Fallback to hmac-sha256 if the regex can't find the algorithm in the key file
      tsig_key_algo: >-
        {{ (tsig_key | regex_search('algorithm\s+.*;') | default('')) | split() | last | regex_replace('[\";]', '') | default('hmac-sha256', true) }}

  # REMOVE the RedHat/Version check so this runs on Suse/Ubuntu
  when: stat_tsig_key.stat.exists or raw_tsig_key is defined

