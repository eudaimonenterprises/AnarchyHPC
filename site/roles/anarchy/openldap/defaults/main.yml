---
# vars file for openldap

openldap_packages:
  - openldap-servers
  - openldap-clients
  - rsync

openldap_default_user: ldap
openldap_default_group: ldap

openldap_server_dir_path: /var/lib/ldap
openldap_server_conf_path: /etc/openldap/slapd.d
openldap_server_defaults_file: /etc/sysconfig/slapd

openldap_endpoints: ldaps:/// ldapi:///
openldap_host: 'controller.cluster'

ssl_cert_group: '{{ openldap_default_user }}'

openldap_tls_cacrt: '{{ ssl_ca_cert }}'
openldap_tls_crt: '{{ ssl_cert_path }}/{{ anarchy_ctrl_hostname if ha else ansible_fqdn }}.crt'
openldap_tls_key: '{{ ssl_cert_path }}/{{ anarchy_ctrl_hostname if ha else ansible_fqdn }}.key'

# The LDAP suffix (base DN) for the directory.
# This value defines the root naming context of the LDAP tree.
#
# Why this is required:
#   - slapd.conf, init.ldif, and ldapsearch must all use the same suffix
#   - The database initialization logic depends on this DN
#
# What can be changed in the future:
#   - You *can* replace this with any valid DN, e.g. "dc=example,dc=com"
#   - You *can* make it environment-specific (prod/dev/test) via inventory
#   - You *can* derive it dynamically from a domain name if desired
#
# IMPORTANT:
#   Changing this value AFTER the LDAP database has been initialized
#   will NOT automatically migrate the existing data.
#   If the suffix changes later, you must:
#     1. Export the DB with slapcat
#     2. Rewrite all DNs to the new suffix
#     3. Re-import with slapadd
#
# In short: this value is flexible BEFORE initialization, but changing it
# later requires a full DN migration.
openldap_suffix: "dc=local"
