---
###############################################################################
# Ensure database directory exists (root-owned before slapadd)
###############################################################################

- name: Ensure database directory exists (root-owned before slapadd)
  file:
    path: "{{ openldap_server_dir_path }}"
    state: directory
    owner: root
    group: root
    mode: '0770'

###############################################################################
# Render initial LDIF (only on primary)
###############################################################################

- name: Render initial LDIF (only on primary)
  template:
    src: init.ldif.j2
    dest: /tmp/init.ldif
    owner: "{{ openldap_default_user }}"
    group: "{{ openldap_default_group }}"
    mode: '0640'
  when: primary | default(true)

###############################################################################
# Check if database already exists
###############################################################################

- name: Check if database is already initialized
  command: ldapsearch -Y EXTERNAL -H ldapi:/// -b "{{ openldap_suffix }}" -s base '(objectClass=*)'
  register: db_exists
  changed_when: false
  ignore_errors: true

###############################################################################
# SAFE INITIALIZATION BLOCK — matches your script exactly
###############################################################################

- block:

    ###########################################################################
    # Stop slapd before destructive DB init
    ###########################################################################
    - name: Stop slapd before DB initialization
      service:
        name: slapd
        state: stopped
      failed_when: false

    ###########################################################################
    # Remove existing DB files
    ###########################################################################
    - name: Remove existing LDAP database files
      file:
        path: "{{ openldap_server_dir_path }}"
        state: absent

    ###########################################################################
    # Recreate DB directory (root-owned for slapadd prep)
    ###########################################################################
    - name: Recreate LDAP database directory (root-owned)
      file:
        path: "{{ openldap_server_dir_path }}"
        state: directory
        owner: root
        group: root
        mode: '0770'

    ###########################################################################
    # Allow ldap user to write slapd.d for slapadd
    ###########################################################################
    - name: Allow ldap user to write slapd.d (for slapadd)
      file:
        path: "{{ openldap_server_conf_path }}"
        owner: "{{ openldap_default_user }}"
        group: "{{ openldap_default_group }}"
        recurse: yes

    ###########################################################################
    # Allow ldap user to write DB directory for slapadd
    ###########################################################################
    - name: Allow ldap user to write DB directory (for slapadd)
      file:
        path: "{{ openldap_server_dir_path }}"
        owner: "{{ openldap_default_user }}"
        group: "{{ openldap_default_group }}"
        mode: '0750'
        recurse: yes

    ###########################################################################
    # Import initial database using slapadd -n 1 -F slapd.d
    ###########################################################################
    - name: Import initial database using slapd.d
      command: >
        runuser -u {{ openldap_default_user }} -- \
        /usr/sbin/slapadd -n 1 -F {{ openldap_server_conf_path }} -l /tmp/init.ldif
      become: true
      
    ###########################################################################
    # Restore slapd.d ownership to root:root
    ###########################################################################
    - name: Restore slapd.d ownership to root:root
      file:
        path: "{{ openldap_server_conf_path }}"
        owner: root
        group: root
        recurse: yes

    ###########################################################################
    # Restore DB directory ownership to ldap:ldap (runtime)
    ###########################################################################
    - name: Restore DB directory ownership to ldap:ldap
      file:
        path: "{{ openldap_server_dir_path }}"
        owner: "{{ openldap_default_user }}"
        group: "{{ openldap_default_group }}"
        mode: '0750'
        recurse: yes

    ###########################################################################
    # Start slapd after initialization
    ###########################################################################
    - name: Start slapd after DB initialization
      service:
        name: slapd
        state: started
        enabled: yes

  when:
    - primary | default(true)
    - db_exists.rc != 0

###############################################################################
# Cleanup temporary LDIF file
###############################################################################

- name: Cleanup temporary LDIF file
  file:
    path: /tmp/init.ldif
    state: absent
