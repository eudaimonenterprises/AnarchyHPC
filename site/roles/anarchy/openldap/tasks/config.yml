---
# Hash OpenLDAP root password (SSHA)
- name: Hash OpenLDAP root password (SSHA)
  command: slappasswd -h {SSHA} -s {{ ldap_root_password }}
  register: ldap_root_password_hash
  changed_when: false
  when: primary | default(true)

# Render slapd.conf
- name: Render OpenLDAP configuration file (slapd.conf)
  template:
    src: slapd.conf.j2
    dest: "{{ openldap_conf_file }}"
    owner: root
    group: root
    mode: '0644'
  register: slapd_conf_rendered

###############################################################################
# SUSE‑SAFE SLAPD.D REGENERATION
# --------------------------------
# SUSE’s OpenLDAP packaging does NOT overwrite existing slapd.d contents when
# running slaptest. If slapd.d already contains a database definition (such as
# an old suffix), slaptest will silently ignore the new slapd.conf database
# section and keep the stale configuration. This leads to fatal errors during
# slapadd such as:
#
#   "database #1 (dc=old,dc=suffix) not configured to hold dc=new"
#
# To guarantee a clean, authoritative configuration, slapd.d MUST be removed
# before regeneration. This is safe and correct on all distros.
###############################################################################

- name: Remove existing slapd.d directory (force clean regeneration)
  file:
    path: "{{ openldap_server_conf_path }}"
    state: absent
  when: primary | default(true)

- name: Recreate slapd.d directory
  file:
    path: "{{ openldap_server_conf_path }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  when: primary | default(true)

# Convert slapd.conf → slapd.d
- name: Generate slapd.d from slapd.conf
  command: >
    slaptest -f {{ openldap_conf_file }}
             -F {{ openldap_server_conf_path }}
  when: primary | default(true)
