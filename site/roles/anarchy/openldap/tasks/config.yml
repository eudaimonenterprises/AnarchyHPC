---
# Hash OpenLDAP root password (SSHA)
- name: Hash OpenLDAP root password (SSHA)
  command: slappasswd -h {SSHA} -s {{ ldap_root_password }}
  register: ldap_root_password_hash
  changed_when: false
  when: primary | default(true)

# Render slapd.conf
- name: Render OpenLDAP configuration file (slapd.conf)
  template:
    src: slapd.conf.j2
    dest: "{{ openldap_conf_file }}"
    owner: root
    group: root
    mode: '0644'
  register: slapd_conf_rendered
  notify:
    - daemon-reload
    - restart openldap

###############################################################################
# SUSE‑SAFE SLAPD.D REGENERATION
# --------------------------------
# We only regenerate slapd.d when slapd.conf changed AND we are on the primary.
# This avoids overwriting a live configuration on re-runs.
###############################################################################

- name: Remove existing slapd.d directory (force clean regeneration)
  file:
    path: "{{ openldap_server_conf_path }}"
    state: absent
  when:
    - primary | default(true)
    - slapd_conf_rendered.changed
  notify:
    - daemon-reload
    - restart openldap

- name: Recreate slapd.d directory
  file:
    path: "{{ openldap_server_conf_path }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  when:
    - primary | default(true)
    - slapd_conf_rendered.changed

# Convert slapd.conf → slapd.d
- name: Generate slapd.d from slapd.conf
  command: >
    slaptest -f {{ openldap_conf_file }}
             -F {{ openldap_server_conf_path }}
  when:
    - primary | default(true)
    - slapd_conf_rendered.changed
  notify:
    - daemon-reload
    - restart openldap
