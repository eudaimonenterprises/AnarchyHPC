---
# site/roles/anarchy/openldap/tasks/certs.yml
# OpenLDAP does NOT generate certificates.
# It only consumes the certificates generated by the ssl-cert role.

- name: Set OpenLDAP TLS certificate paths
  set_fact:
    openldap_tls_crt: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.crt"
    openldap_tls_key: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.key"
    openldap_tls_ca: "{{ openldap_tls_cacrt }}"
