---
- name: Abort on unsupported SUSE Leap 16
  fail:
    msg: "openSUSE Leap 16 requires a separate OpenLDAP stack."
  when:
    - ansible_distribution_major_version | int >= 16

###############################################################################
# SUSE Leap 15 — Clean, stable OpenLDAP stack
###############################################################################

# Install required packages
- name: Install OpenLDAP packages (SUSE Leap 15)
  when:
    - ansible_distribution_major_version | int <= 15
  zypper:
    name:
      - openldap2
      - openldap2-client
      - cyrus-sasl
    state: present

###############################################################################
# TLS CA configuration (Leap 15 uses system CA bundle)
###############################################################################

- name: Configure client TLS CA (SUSE)
  lineinfile:
    path: /etc/openldap/ldap.conf
    regexp: '^TLS_CACERT'
    line: 'TLS_CACERT /etc/ssl/ca-bundle.pem'
  when: ansible_os_family == "Suse"

# >>> INSERT THE VERIFICATION BLOCK HERE <<<

- name: Check that cluster CA is installed in trust anchors
  stat:
    path: "/etc/pki/trust/anchors/{{ ssl_ca_cert | basename }}"
  register: trust_anchor_stat

- name: Check that system CA bundle exists
  stat:
    path: /etc/ssl/ca-bundle.pem
  register: ca_bundle_stat

- name: Debug trust store status
  debug:
    msg: |
      Trust anchor installed: {{ trust_anchor_stat.stat.exists }}
      System CA bundle exists: {{ ca_bundle_stat.stat.exists }}

###############################################################################
# slapd.d relocation (Leap 15 supports this normally)
###############################################################################

- name: Check default slapd.d path (Leap 15)
  when: ansible_distribution_major_version | int <= 15
  stat:
    path: /etc/openldap/slapd.d
  register: default_openldap_path

- block:
    - name: Ensure custom config directory exists (Leap 15)
      file:
        path: "{{ openldap_server_conf_path }}"
        state: directory
        owner: "{{ openldap_default_user }}"
        group: "{{ openldap_default_group }}"

    - name: Copy default slapd.d to custom path (Leap 15)
      when: primary | default(true)
      shell: rsync -raW /etc/openldap/slapd.d/* {{ openldap_server_conf_path | quote }}
      args:
        creates: "{{ openldap_server_conf_path }}/cn=config.ldif"

    - name: Remove default slapd.d (Leap 15)
      file:
        path: /etc/openldap/slapd.d
        state: absent

    - name: Symlink slapd.d to custom path (Leap 15)
      file:
        src: "{{ openldap_server_conf_path }}"
        dest: /etc/openldap/slapd.d
        state: link
        force: true

  when:
    - ansible_distribution_major_version | int <= 15
    - openldap_server_conf_path != '/etc/openldap/slapd.d'
    - default_openldap_path.stat.isdir

###############################################################################
# Schema installation (Leap 15 supports normal schema loading)
###############################################################################

- block:
    - name: Ensure schema directory exists (Leap 15)
      file:
        path: /etc/openldap/schema
        state: directory

    - name: Copy schemas (Leap 15)
      copy:
        src: "{{ item }}"
        dest: /etc/openldap/schema/
      loop:
        - rfc2307bis.ldif
        - autoinc.ldif
        - local_schema.ldif

  when:
    - ansible_distribution_major_version | int <= 15
    - primary | default(true)

###############################################################################
# 3.5 Enable LDAPS listener (SUSE-specific)
###############################################################################

- name: Ensure /etc/sysconfig/openldap exists
  file:
    path: /etc/sysconfig/openldap
    state: touch
    owner: root
    group: root
    mode: '0644'

- name: Enable LDAPS in SUSE OpenLDAP
  lineinfile:
    path: /etc/sysconfig/openldap
    regexp: '^OPENLDAP_START_LDAPS='
    line: 'OPENLDAP_START_LDAPS="yes"'
    create: yes

- name: Ensure LDAP listener is enabled
  lineinfile:
    path: /etc/sysconfig/openldap
    regexp: '^OPENLDAP_START_LDAP='
    line: 'OPENLDAP_START_LDAP="yes"'
    create: yes

- name: Ensure LDAPI listener is enabled
  lineinfile:
    path: /etc/sysconfig/openldap
    regexp: '^OPENLDAP_START_LDAPI='
    line: 'OPENLDAP_START_LDAPI="yes"'
    create: yes
