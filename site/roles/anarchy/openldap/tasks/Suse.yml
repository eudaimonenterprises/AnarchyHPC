---
###############################################################################
# SUSE: Install packages
###############################################################################

- name: Install OpenLDAP packages (SUSE)
  zypper:
    name:
      - openldap2
      - openldap2-client
      - cyrus-sasl
    state: present

###############################################################################
# SUSE: Password handling (shared include)
###############################################################################

- include_tasks: password.yml
  vars:
    password_type: "openldap"

###############################################################################
# SUSE: Cluster CA handling (shared include)
###############################################################################

- include_tasks: ca.yml

###############################################################################
# SUSE: TLS + defaults
###############################################################################

- name: Hash OpenLDAP root password
  command: slappasswd -h {SSHA} -s {{ ldap_root_password }}
  register: openldap_root_pwd_hash
  changed_when: false
  when: primary | default(true)

- name: Set OpenLDAP root password facts
  set_fact:
    openldap_root_pwd: "{{ ldap_root_password }}"
    openldap_root_pwd_hash: "{{ openldap_root_pwd_hash.stdout }}"
  when: primary | default(true)

- name: Configure slapd URLs
  lineinfile:
    path: /etc/sysconfig/openldap
    regexp: '^SLAPD_URLS='
    line: 'SLAPD_URLS="{{ openldap_endpoints }}"'
    create: true

- name: Configure client TLS CA (SUSE)
  lineinfile:
    path: /etc/openldap/ldap.conf
    regexp: '^TLS_CACERT'
    line: 'TLS_CACERT /etc/ssl/ca-bundle.pem'

###############################################################################
# SUSE: slapd.d relocation (same logic as RHEL)
###############################################################################

- name: Check default slapd.d path
  stat:
    path: /etc/openldap/slapd.d
  register: default_openldap_path

- block:
    - name: Ensure custom config directory exists
      file:
        path: "{{ openldap_server_conf_path }}"
        state: directory
        owner: "{{ openldap_default_user }}"
        group: "{{ openldap_default_group }}"

    - name: Copy default slapd.d to custom path
      shell: rsync -raW /etc/openldap/slapd.d/* {{ openldap_server_conf_path | quote }}
      args:
        creates: "{{ openldap_server_conf_path }}/cn=config.ldif"
      when: primary | default(true)

    - name: Remove default slapd.d
      file:
        path: /etc/openldap/slapd.d
        state: absent

    - name: Symlink slapd.d to custom path
      file:
        src: "{{ openldap_server_conf_path }}"
        dest: /etc/openldap/slapd.d
        state: link
        force: true
  when:
    openldap_server_conf_path != '/etc/openldap/slapd.d'
    and default_openldap_path.stat.isdir

###############################################################################
# SUSE: Start service (non‑HA)
###############################################################################

- name: Enable slapd (non‑HA)
  systemd:
    name: slapd
    enabled: true
  when: not ha | default(false)

###############################################################################
# SUSE: Initial schema + config load
###############################################################################

- block:
    - name: Ensure data directory exists
      file:
        path: "{{ openldap_server_dir_path }}"
        state: directory
        owner: "{{ openldap_default_user }}"
        group: "{{ openldap_default_group }}"

    - name: Start slapd
      systemd:
        name: slapd
        state: started
        enabled: true

    - name: Copy schemas
      copy:
        src: "{{ item }}"
        dest: /etc/openldap/schema/
      loop:
        - rfc2307bis.ldif
        - autoinc.ldif
        - local_schema.ldif
  when: primary | default(true)

###############################################################################
# SUSE: Load schemas + overlays (same logic as RHEL)
###############################################################################

# SUSE ships OpenLDAP 2.4.x in Leap 15, so only the <=2.4 block will run.
# You can include the same <=2.4 and >=2.5 blocks from RedHat.yml here.

###############################################################################
# SUSE: HA integration
###############################################################################

- block:
    - name: Disable slapd for HA
      systemd:
        name: slapd
        state: "{{ 'started' if primary else 'stopped' }}"
        enabled: false

    - name: Add Pacemaker resource
      pcs_resource:
        name: openldap
        resource_class: systemd
        resource_type: systemd:slapd
        options: "meta migration-threshold=3 failure-timeout=120s op monitor interval=30 --group Anarchy-stack"
        state: present
      when: primary | default(true)
  when: ha | default(false)

- meta: flush_handlers
