---
###############################################################################
# Unified OpenLDAP service management for all distros EXCEPT openSUSE Leap 16
###############################################################################

# Abort on Leap 16 (requires separate hack stack)
- name: Abort on unsupported SUSE Leap 16
  fail:
    msg: "openSUSE Leap 16 requires a separate OpenLDAP service stack and is not supported by this service.yml."
  when:
    - ansible_os_family == "Suse"
    - ansible_distribution_major_version | int >= 16

###############################################################################
# Non‑HA mode — normal systemd management
###############################################################################

- name: Start and enable slapd (non‑HA primary)
  systemd:
    name: slapd
    state: started
    enabled: true
  when:
    - not ha | default(false)
    - primary | default(true)

- name: Enable slapd on non‑HA secondaries
  systemd:
    name: slapd
    enabled: true
  when:
    - not ha | default(false)
    - not primary | default(false)

###############################################################################
# HA mode — disable local slapd and register Pacemaker resource
###############################################################################

- block:

    - name: Disable local slapd for HA
      systemd:
        name: slapd
        state: stopped
        enabled: false

    - name: Register OpenLDAP as a Pacemaker resource
      pcs_resource:
        name: openldap
        resource_class: systemd
        resource_type: systemd:slapd
        options: "meta migration-threshold=3 failure-timeout=120s op monitor interval=30 --group Anarchy-stack"
        state: present
      when: primary | default(true)

  when:
    - ha | default(false)
