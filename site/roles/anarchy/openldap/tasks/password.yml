---
###############################################################################
# UNIVERSAL PASSWORD GENERATION (REMOTE‑SAFE, HA‑AWARE)
###############################################################################

# Determine which password we are working with
# (OpenLDAP or DS389)
- set_fact:
    ldap_pwd_dir: "/etc/anarchy/passwords/{{ password_type }}"
    ldap_pwd_file: "/etc/anarchy/passwords/{{ password_type }}/root.txt"

# Ensure password directory exists
- name: Ensure password directory exists
  file:
    path: "{{ ldap_pwd_dir }}"
    state: directory
    mode: 0700

###############################################################################
# HA MODE — PRIMARY GENERATES PASSWORD
###############################################################################

- block:
    - name: Generate password on primary (HA)
      command: "openssl rand -hex 16"
      register: ldap_generated_pwd

    - name: Save generated password on primary (HA)
      copy:
        content: "{{ ldap_generated_pwd.stdout }}"
        dest: "{{ ldap_pwd_file }}"
        mode: 0600
  when:
    - ha | default(false)
    - primary | default(true)

###############################################################################
# HA MODE — SECONDARIES SYNC PASSWORD
###############################################################################

- block:
    - name: Copy password from sync (HA secondary)
      copy:
        remote_src: true
        src: "{{ anarchy_sync }}/{{ password_type }}/root.txt"
        dest: "{{ ldap_pwd_file }}"
        mode: 0600
  when:
    - ha | default(false)
    - not primary | default(false)

###############################################################################
# HA MODE — PRIMARY SYNC TO CLUSTER
###############################################################################

- block:
    - name: Ensure sync directory exists
      file:
        path: "{{ anarchy_sync }}/{{ password_type }}"
        state: directory

    - name: Sync password to cluster
      copy:
        remote_src: true
        src: "{{ ldap_pwd_file }}"
        dest: "{{ anarchy_sync }}/{{ password_type }}/"
        mode: 0640
  when:
    - ha | default(false)
    - primary | default(true)

###############################################################################
# NON‑HA MODE — GENERATE PASSWORD IF MISSING
###############################################################################

- name: Check if password file exists (non‑HA)
  stat:
    path: "{{ ldap_pwd_file }}"
  register: ldap_pwd_stat
  when: not ha | default(false)

- block:
    - name: Generate password (non‑HA)
      command: "openssl rand -hex 16"
      register: ldap_generated_pwd_nonha

    - name: Save password (non‑HA)
      copy:
        content: "{{ ldap_generated_pwd_nonha.stdout }}"
        dest: "{{ ldap_pwd_file }}"
        mode: 0600
  when:
    - not ha | default(false)
    - not ldap_pwd_stat.stat.exists

###############################################################################
# READ PASSWORD ON ALL NODES
###############################################################################

- name: Read LDAP password
  slurp:
    src: "{{ ldap_pwd_file }}"
  register: ldap_pwd_file_data

- set_fact:
    ldap_root_password: "{{ ldap_pwd_file_data.content | b64decode }}"
