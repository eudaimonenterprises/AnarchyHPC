---
# Load OS-specific variables
- name: Load OS-specific vars
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}.yml"
    - "{{ ansible_distribution }}.yml"
    - "default.yml"

# OS-specific environment-modules setup (no OpenHPC here)
- name: Run OS-specific environment-modules setup
  include_tasks: "{{ ansible_os_family }}.yml"

# Shared tasks across all OSes
- name: Install profile for modules
  template:
    src: z_modules.sh.j2
    dest: /etc/profile.d/z_modules.sh
    mode: "0644"

# Check if modulefiles directory exists
- name: Check if modulefiles directory exists
  stat:
    path: "{{ anarchy_modulefiles }}"
  register: modulefiles_dir

# Install dummy module only if directory exists
- name: Install dummy module
  template:
    src: dummy-module.lua.j2
    dest: "{{ anarchy_modulefiles }}/dummy-module.lua"
    mode: "0644"
  when:
    - on_controller
    - primary | default(True)
    - modulefiles_dir.stat.exists
