---
- name: Install tunables packages (RHEL/Rocky/Alma)
  package:
    name: "{{ tunables_packages }}"
    state: present
    enablerepo:
      - powertools
      - crb
      - codeready-builder-for-rhel-*-x86_64-rpm
      - codeready-builder-for-rhel-*-aarch64-rpm
    disable_gpg_check: true
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"
  tags: install-only

- name: Copy 91-hpc-limits.conf to /etc/security/limits.d
  template:
    src: '91-hpc-limits.conf.j2'
    dest: '/etc/security/limits.d/91-hpc-limits.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'

- name: Copy 91-hpc-sysctl.conf to /etc/sysctl.d/
  template:
    src: '91-hpc-sysctl.conf.j2'
    dest: '/etc/sysctl.d/91-hpc-sysctl.conf'
    owner: 'root'
    group: 'root'
    mode: '0644'
    backup: true
  notify: activate sysctls

- name: Setting compute performance tuned profile (RHEL)
  shell: "tuned-adm profile {{ compute_tuned_profile | default('hpc-compute') }}"
  ignore_errors: true

- name: Setting controller performance tuned profile (RHEL)
  shell: "tuned-adm profile {{ controller_tuned_profile | default('throughput-performance') }}"
  when: on_controller
  ignore_errors: true

- block:
    - name: Ensure NFS threads are set to 256
      lineinfile:
        path: /etc/nfs.conf
        regexp: '^threads='
        line: 'threads=256'
        create: yes
  when: on_controller
