---
###############################################################################
# 1. Load OS‑specific pacemaker vars
###############################################################################

- name: Load OS‑specific pacemaker vars
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ ansible_os_family }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ ansible_os_family }}.yaml"     # FALLBACK: RedHat.yaml, Suse.yaml, Debian.yaml
    - "default.yaml"
  no_log: false

###############################################################################
# 2. Install HA packages (multi‑OS)
###############################################################################

# SUSE
- name: Install HA packages (SUSE)
  zypper:
    name: "{{ ha_packages }}"
    state: present
  when: ansible_os_family == "Suse"

- name: Install additional packages (SUSE)
  zypper:
    name: "{{ additional_packages }}"
    state: present
  when: ansible_os_family == "Suse"

# Debian / Ubuntu
- name: Update apt cache
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install HA packages (Debian/Ubuntu)
  apt:
    name: "{{ ha_packages }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install additional packages (Debian/Ubuntu)
  apt:
    name: "{{ additional_packages }}"
    state: present
  when: ansible_os_family == "Debian"

# RedHat
- name: Install HA packages (RHEL/Rocky/Alma)
  yum:
    name: "{{ ha_packages }}"
    state: present
    enablerepo:
      - ha
      - highavailability
      - resilientstorage
      - rhel-8-for-x86_64-highavailability-rpms
      - rhel-9-for-x86_64-highavailability-rpms
  when: ansible_os_family == "RedHat"

- name: Install additional packages (RHEL/Rocky/Alma)
  yum:
    name: "{{ additional_packages }}"
    state: present
  when: ansible_os_family == "RedHat"

###############################################################################
# 3. Corosync key generation + sync
###############################################################################

- name: Verify if corosync key exists
  stat:
    path: /etc/corosync/authkey
  register: stat_corosync_key

- name: Create corosync key
  command: "corosync-keygen -l"
  args:
    creates: '/etc/corosync/authkey'
  when:
    - not stat_corosync_key.stat.exists
    - primary

- block:
  - name: Ensure corosync sync directory exists
    file:
      path: '{{ anarchy_sync }}/corosync'
      state: directory

  - name: Copy corosync key to sync
    copy:
      remote_src: true
      src: '/etc/corosync/authkey'
      dest: '{{ anarchy_sync }}/corosync/'
      mode: 0640
      owner: root
      group: root
  when: primary

- name: Copy corosync key from sync
  copy:
    remote_src: true
    src: '{{ anarchy_sync }}/corosync/authkey'
    dest: '/etc/corosync/'
    mode: 0640
    owner: root
    group: root
  when: not primary

###############################################################################
# 4. Configure corosync
###############################################################################

- name: Configure corosync
  template:
    src: "corosync.conf.j2"
    dest: "/etc/corosync/corosync.conf"
  register: corosync_config

- name: Restart corosync
  service:
    name: corosync
    state: restarted
    enabled: true
  when: corosync_config.changed

###############################################################################
# 5. Install PCS (RedHat only) or crmsh (SUSE/Debian)
###############################################################################

# RedHat PCS
- name: Install PCS via pip (RHEL only)
  ansible.builtin.shell: |
    source {{ anarchy_local }}/python/bin/activate
    pip3 install --upgrade {{ pcs_noarch_pip_repository }}/{{ pcs_pip }}
    exit $?
  args:
    executable: /bin/bash
  when:
    - ansible_os_family == "RedHat"
    - pcs_pip is defined

- name: Install PCS via pip (fallback)
  ansible.builtin.shell: |
    source {{ anarchy_local }}/python/bin/activate
    pip3 install --upgrade -i {{ pcs_noarch_pip_repository }}/ pcs
    exit $?
  args:
    executable: /bin/bash
  when:
    - ansible_os_family == "RedHat"
    - pcs_pip is not defined

# SUSE + Debian use crmsh
- name: Install crmsh (SUSE/Debian)
  package:
    name: crmsh
    state: present
  when: ansible_os_family in ["Suse", "Debian"]

###############################################################################
# 6. PCS wrapper (RHEL only)
###############################################################################

- name: Install PCS wrapper
  template:
    src: 'pcs.j2'
    dest: '/usr/local/sbin/pcs'
    owner: root
    group: root
    mode: 0755
  when: ansible_os_family == "RedHat"

###############################################################################
# 7. Corosync service.d
###############################################################################

- name: Ensure corosync service.d directory exists
  file:
    path: /etc/corosync/service.d/
    state: directory

- name: Adding pcmk service to corosync
  copy:
    src: "{{ item }}"
    dest: "/etc/corosync/service.d/"
  with_items:
    - pcmk

###############################################################################
# 8. Custom resource agents
###############################################################################

- name: Ensure custom resource agents exist
  copy:
    src: '{{ item }}'
    dest: '/usr/lib/ocf/resource.d/heartbeat/{{ item }}'
    owner: root
    group: root
    mode: 0755
    force: no
  with_items:
    - ZFS
    - iscsi
  ignore_errors: true

###############################################################################
# 9. Start services
###############################################################################

- name: Start pacemaker service
  service:
    name: pacemaker
    state: started
    enabled: true

- name: Start corosync service
  service:
    name: corosync
    state: started
    enabled: true

###############################################################################
# 10. Standby non‑primary nodes
###############################################################################

- name: set property 'standby' to 'on' for non primary node
  pcs_property:
    name: 'standby'
    node: '{{ ansible_hostname }}'
    value: 'on'
  ignore_errors: true
  when:
    - not primary
    - ansible_os_family == "RedHat"

###############################################################################
# 11. Pacemaker resources (primary only)
###############################################################################

- block:
  - name: Set pacemaker properties
    pcs_property:
      name: '{{ item.key }}'
      value: '{{ item.value }}'
    with_dict: '{{ pacemaker_properties }}'

  - name: Setup pacemaker resource defaults
    command: pcs resource defaults '{{ item }}'
    register: result
    until: result.rc == 0
    retries: 10
    delay: 15
    with_items: '{{ pacemaker_resource_defaults }}'

  - name: Add floating IP resource
    pcs_resource:
      name: 'anarchy-ip'
      resource_type: 'ocf:heartbeat:IPaddr2'
      options: 'ip={{ anarchy_ctrl_ip }} nic={{ anarchy_ctrl_interface }} cidr_netmask={{ anarchy_cluster_netprefix }} op monitor interval=29s --group Anarchy'
      state: present

  - name: Add external floating IP resource
    pcs_resource:
      name: 'anarchy-ip-external'
      resource_type: 'ocf:heartbeat:IPaddr2'
      options: 'ip={{ anarchy_ctrl_external_floating_ip }} nic={{ anarchy_ctrl_external_nic }} cidr_netmask={{ anarchy_external_netprefix }} op monitor interval=29s --group Anarchy'
      state: present
    when:
      - anarchy_ctrl_external_floating_ip | default('') != ''
      - anarchy_external_netprefix | default('') != ''
      - anarchy_ctrl_external_nic | default('') != ''
  when:
    - primary
    - ansible_os_family == "RedHat"

###############################################################################
# 12. Fencing (primary only)
###############################################################################

- block:
  - name: Toggle pacemaker stonith property
    pcs_property:
      name: stonith-enabled
      value: false

  - block:
    - name: Configure fencing resources using the ipmilan fencing agent
      pcs_resource:
        name: 'fence-{{ item.0 }}'
        resource_class: 'stonith'
        resource_type: 'fence_ipmilan'
        options: 'pcmk_host_check={{ fence_ipmilan_host_check }} pcmk_host_list={{ item.0 }} pcmk_host_map={{ item.0 }}:{{ item.1 }} ipaddr={{ item.1 }} method={{ fence_ipmilan_method }} lanplus={{ fence_ipmilan_lanplus }} login={{ fence_ipmilan_login }} passwd={{ fence_ipmilan_passwd }}'
        state: present
      with_together:
        - '{{ all_ctrl_hostname }}'
        - '{{ all_ctrl_bmcip }}'

    - name: Add fencing location constraints
      pcs_constraint_location:
        resource: 'fence-{{ item }}'
        node_name: '{{ item }}'
        score: '-INFINITY'
        state: present
      with_items: '{{ all_ctrl_hostname }}'
    when: fence_ipmilan_enabled
  when:
    - primary
    - ansible_os_family == "RedHat"
  tags: fencing
