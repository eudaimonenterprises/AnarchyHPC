---
###############################################################################
# OBOL: PASSWORD GENERATION (REMOTE‑SAFE)
###############################################################################

# Ensure password directories exist
- name: Ensure password directories exist
  file:
    path: "/etc/anarchy/passwords/{{ 'ds389' if obol_use_ds389 | default(False) else 'openldap' }}"
    state: directory
    mode: 0700

###############################################################################
# OpenLDAP password path
###############################################################################
- set_fact:
    obol_pwd_path: "/etc/anarchy/passwords/openldap/root.txt"
  when: not obol_use_ds389 | default(True)

###############################################################################
# DS389 password path
###############################################################################
- set_fact:
    obol_pwd_path: "/etc/anarchy/passwords/ds389/root.txt"
  when: obol_use_ds389 | default(False)

###############################################################################
# Generate password if missing
###############################################################################

- name: Check if password file exists
  stat:
    path: "{{ obol_pwd_path }}"
  register: obol_pwd_stat

- name: Generate password if missing
  command: "openssl rand -hex 16"
  register: obol_generated_pwd
  when: not obol_pwd_stat.stat.exists

- name: Save generated password
  copy:
    content: "{{ obol_generated_pwd.stdout }}"
    dest: "{{ obol_pwd_path }}"
    mode: 0600
  when: not obol_pwd_stat.stat.exists

###############################################################################
# Read password on all nodes
###############################################################################

- name: Read OBOL password
  slurp:
    src: "{{ obol_pwd_path }}"
  register: obol_pwd_file

- set_fact:
    openldap_root_pwd: "{{ obol_pwd_file.content | b64decode }}"
  when: not obol_use_ds389 | default(True)

- set_fact:
    ds389_root_pwd: "{{ obol_pwd_file.content | b64decode }}"
  when: obol_use_ds389 | default(False)

###############################################################################
# Install obol dependency packages
###############################################################################

- name: Install obol dependency packages
  become: false
  yum:
    name: '{{ obol_packages }}'
    state: present
  tags: install-only
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

###############################################################################
# Install obol script
###############################################################################

- name: Install obol to /usr/local/sbin
  template:
    src: 'obol.j2'
    dest: '/usr/local/sbin/obol'
    owner: 'root'
    group: 'root'
    mode: '0750'

###############################################################################
# Install obol configuration
###############################################################################

- name: Add default configuration to {{ obol_conf_path }}
  template:
    src: 'obol.conf.j2'
    dest: '{{ obol_conf_path }}/obol.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'

- name: Add link to the configuration file in /etc
  file:
    src: '{{ obol_conf_path }}'
    dest: '/etc/'
    state: link
  when: obol_conf_path|string not in '/etc'
