- name: Load OS-specific vars
  include_vars: "{{ ansible_os_family }}.yml"

###############################################################################
# OBOL: LDAP PASSWORD HANDLING (shared include)
###############################################################################

- include_tasks: "{{ role_path }}/../openldap/tasks/password.yml"
  vars:
    password_type: "{{ 'ds389' if obol_use_ds389 | default(False) else 'openldap' }}"

###############################################################################
# OBOL: LDAP CA CONSUMPTION (client trust only)
###############################################################################

- name: Set Obol CA bundle path per OS
  set_fact:
    obol_ldap_cacert: >-
      {% if ansible_os_family == 'Suse' %}
        {{ ssl_ca_cert }}
      {% elif ansible_os_family == 'RedHat' %}
        /etc/pki/tls/certs/ca-bundle.crt
      {% elif ansible_os_family == 'Debian' %}
        /etc/ssl/certs/ca-certificates.crt
      {% else %}
        /etc/ssl/certs/ca-certificates.crt
      {% endif %}

###############################################################################
# OBOL: Install dependency packages (portable)
###############################################################################

- name: Verify python3 can import ldap (SUSE)
  command: python3 -c "import ldap"
  register: ldap_import
  failed_when: false
  changed_when: false
  when: ansible_os_family == "Suse"

- name: Warn if ldap module is missing before installation
  debug:
    msg: >
      python3 cannot import ldap yet. Installing python3-ldap.
  when:
    - ansible_os_family == "Suse"
    - ldap_import.rc != 0


- name: Install obol dependency packages
  package:
    name: "{{ obol_packages }}"
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

###############################################################################
# OBOL: Install obol script
###############################################################################

- name: Install obol to /usr/local/sbin
  template:
    src: 'obol.j2'
    dest: '/usr/local/sbin/obol'
    owner: 'root'
    group: 'root'
    mode: '0750'

###############################################################################
# OBOL: Ensure configuration directory exists
###############################################################################

- name: Ensure obol configuration directory exists
  file:
    path: "{{ obol_conf_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

###############################################################################
# OBOL: Install configuration
###############################################################################

- name: Add default configuration to {{ obol_conf_path }}
  template:
    src: 'obol.conf.j2'
    dest: '{{ obol_conf_path }}/obol.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'
  vars:
    obol_ldap_password: "{{ ldap_root_password }}"
    obol_ldap_cacert: "{{ obol_ldap_cacert }}"
