---
###############################################################################
# OBOL: LDAP PASSWORD HANDLING (shared include)
###############################################################################

- include_tasks: "{{ role_path }}/../openldap/tasks/password.yml"
  vars:
    password_type: "{{ 'ds389' if obol_use_ds389 | default(False) else 'openldap' }}"

###############################################################################
# OBOL: LDAP CA CONSUMPTION (client trust only)
###############################################################################

- name: Ensure Obol CA directory exists
  file:
    path: /etc/obol/certs
    state: directory
    mode: 0755

- name: Install LDAP cluster CA certificate for Obol
  copy:
    remote_src: true
    src: /etc/openldap/certs/cluster-ca.crt
    dest: /etc/obol/certs/cluster-ca.crt
    mode: 0644

###############################################################################
# OBOL: Install dependency packages
###############################################################################

- name: Install obol dependency packages
  yum:
    name: "{{ obol_packages }}"
    state: present
  tags: install-only
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

###############################################################################
# OBOL: Install obol script
###############################################################################

- name: Install obol to /usr/local/sbin
  template:
    src: 'obol.j2'
    dest: '/usr/local/sbin/obol'
    owner: 'root'
    group: 'root'
    mode: '0750'

###############################################################################
# OBOL: Install configuration
###############################################################################

- name: Add default configuration to {{ obol_conf_path }}
  template:
    src: 'obol.conf.j2'
    dest: '{{ obol_conf_path }}/obol.conf'
    owner: 'root'
    group: 'root'
    mode: '0600'
  vars:
    obol_ldap_password: "{{ ldap_root_password }}"
    obol_ldap_cacert: "/etc/obol/certs/cluster-ca.crt"

- name: Add link to the configuration file in /etc
  file:
    src: '{{ obol_conf_path }}'
    dest: '/etc/'
    state: link
  when: obol_conf_path|string not in '/etc'
