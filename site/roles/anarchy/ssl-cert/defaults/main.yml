---
# Certificate subject information
ssl_cert_country: ''
ssl_cert_state: ''
ssl_cert_locality: ''
ssl_cert_organization: ''
ssl_cert_altname: '{{ ansible_fqdn }}'
ssl_cert_altip: '{{ ansible_default_ipv4.address }}'

# Certificate lifetime (in days)
ssl_cert_days: '3650'

# Ownership of generated certificates and keys
# Root owns the certs; no UID/GID variables so Ansible never tries to create them
ssl_cert_owner: 'root'
ssl_cert_group: 'root'

# CA trust store locations for different Linux families
ssl_ca_cert_store:
  - name: RedHat
    location: /etc/pki/ca-trust/source/anchors/
    update_trust: update-ca-trust

  - name: Debian
    location: /usr/local/share/ca-certificates/
    update_trust: update-ca-certificates

  - name: Suse
    location: /etc/pki/trust/anchors/
    update_trust: update-ca-certificates

  - name: SLE
    location: /etc/pki/trust/anchors/
    update_trust: update-ca-certificates
