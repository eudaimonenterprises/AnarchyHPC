---
###############################################################################
# 1. Create certificate owner/group (portable, no UID/GID issues)
###############################################################################

- block:

  - name: Ensure certificate owner user exists (non-root)
    user:
      name: "{{ ssl_cert_owner }}"
      system: yes
      state: present
    when:
      - ssl_cert_owner != 'root'

  - name: Ensure certificate group exists (non-root)
    group:
      name: "{{ ssl_cert_group }}"
      system: yes
      state: present
    when:
      - ssl_cert_group != 'root'

  when: on_controller | default(False) or in_login_image | default(False)


###############################################################################
# 2. Generate cluster CA (primary controller or image build)
###############################################################################

- block:

  - name: Ensure certificate directory exists
    file:
      path: "{{ ssl_cert_path }}"
      state: directory
      owner: "{{ ssl_cert_owner }}"
      group: "{{ ssl_cert_group }}"
      mode: "0750"

  - name: Generate cluster CA
    command: >
      openssl req -newkey rsa:4096
        -nodes -sha512 -x509
        -days {{ ssl_cert_days }}
        -subj "/CN=cluster-ca"
        -out "{{ ssl_ca_cert }}"
        -keyout "{{ ssl_ca_key }}"
    args:
      creates: "{{ ssl_ca_cert }}"

  when: in_login_image | default(False) or
        ((primary | default(True) or in_cloud | default(False)) and on_controller | default(False))


###############################################################################
# 3. Sync CA from primary controller
###############################################################################

- name: Copy cluster CA certificate from sync
  copy:
    remote_src: true
    src: "{{ anarchy_sync }}/ssl/{{ item }}"
    dest: "{{ ssl_cert_path }}"
  loop:
    - "{{ ssl_ca_cert | basename }}"
    - "{{ ssl_ca_key | basename }}"
  when:
    - not in_cloud | default(False)
    - not primary | default(False)
    - on_controller | default(False)
    - not in_image


###############################################################################
# 4. Generate node certificates
###############################################################################

- block:

  - name: Render SAN configuration
    template:
      src: "san.conf.j2"
      dest: "{{ ssl_cert_path }}/san.conf"
      mode: "0660"

  - block:
      - name: Find existing certs for backup
        find:
          paths: "{{ ssl_cert_path }}"
          patterns: "{{ ansible_fqdn }}.*"
        register: ssl_existing_cert

      - name: Ensure backup directory exists
        file:
          path: "{{ ssl_cert_path }}/backup"
          state: directory

      - name: Backup existing certificate artifacts
        command: "mv -f {{ item.path }} {{ ssl_cert_path }}/backup/"
        loop: "{{ ssl_existing_cert.files }}"
    when: override | default(False)

  - name: Create CSR for this node
    command: >
      openssl req -new -nodes -sha512
        -subj "/C={{ ssl_cert_country }}/ST={{ ssl_cert_state }}/L={{ ssl_cert_locality }}/O={{ ssl_cert_organization }}/CN={{ ansible_fqdn }}"
        -out "{{ ssl_cert_path }}/{{ ansible_fqdn }}.csr"
        -keyout "{{ ssl_cert_path }}/{{ ansible_fqdn }}.key"
        -config "{{ ssl_cert_path }}/san.conf"
    args:
      creates: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.csr"

  - name: Sign CSR with cluster CA
    command: >
      openssl x509 -req
        -days {{ ssl_cert_days }}
        -in "{{ ssl_cert_path }}/{{ ansible_fqdn }}.csr"
        -CA "{{ ssl_ca_cert }}"
        -CAkey "{{ ssl_ca_key }}"
        -out "{{ ssl_cert_path }}/{{ ansible_fqdn }}.crt"
        -extensions req_ext
        -extfile "{{ ssl_cert_path }}/san.conf"
        -set_serial {{ ansible_date_time.epoch }}
    args:
      creates: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.crt"

  - name: Create symlinks for floating H/A controller
    file:
      src: "{{ ssl_cert_path }}/{{ ansible_fqdn }}.{{ item }}"
      dest: "{{ ssl_cert_path }}/{{ anarchy_ctrl_hostname }}.{{ item }}"
      state: link
    loop:
      - crt
      - key
    when: ha | default(False)

  - name: Find private keys
    find:
      paths: "{{ ssl_cert_path }}"
      patterns: "*.key"
    register: ssl_private_keys

  - name: Restrict private key permissions
    file:
      path: "{{ item.path }}"
      mode: "0640"
    loop: "{{ ssl_private_keys.files }}"

  - name: Fix ownership of certificate directory
    file:
      path: "{{ ssl_cert_path }}"
      owner: "{{ ssl_cert_owner }}"
      group: "{{ ssl_cert_group }}"
      recurse: yes

  when:
    - in_login_image | default(False) or (on_controller | default(False) and not in_image)


###############################################################################
# 5. Sync CA to secondary controllers
###############################################################################

- block:

  - name: Ensure SSL sync directory exists
    file:
      path: "{{ anarchy_sync }}/ssl"
      state: directory

  - name: Copy CA to sync directory
    copy:
      remote_src: true
      src: "{{ ssl_cert_path }}/{{ item }}"
      dest: "{{ anarchy_sync }}/ssl/{{ item }}"
      mode: "0640"
    loop:
      - "{{ ssl_ca_cert | basename }}"
      - "{{ ssl_ca_key | basename }}"

  when:
    - primary | default(True)
    - ha | default(False)
    - on_controller | default(False)
    - not in_image


###############################################################################
# 6. Install CA into OS trust store
###############################################################################

- name: Add CA certificate to OS trust store
  copy:
    src: "{{ ssl_ca_cert }}"
    dest: "{{ item.location }}/{{ ssl_ca_cert | basename }}"
    remote_src: true
  register: cert_copy
  loop: "{{ ssl_ca_cert_store }}"
  when: item.name == ansible_facts['os_family']

- name: Update OS trust store
  shell: "{{ item.update_trust }}"
  changed_when: cert_copy.changed
  loop: "{{ ssl_ca_cert_store }}"
  when: item.name == ansible_facts['os_family']