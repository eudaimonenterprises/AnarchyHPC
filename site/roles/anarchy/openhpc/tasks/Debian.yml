---
- name: Add OpenHPC repo for Debian
  apt_repository:
    repo: "deb [trusted=yes] http://your-debian-openhpc-mirror stable main"
    state: present

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install OpenHPC base packages
  apt:
    name:
      - ohpc-base
      - ohpc-base-compute
    state: present

- name: Install lmod
  apt:
    name: lmod
    state: present

- name: Install pdsh
  apt:
    name: pdsh
    state: present

- name: Mark OpenHPC as managing the module system
  set_fact:
    openhpc_manages_modules: true
