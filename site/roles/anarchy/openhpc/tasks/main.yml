---
# Detect whether OpenHPC is available on this OS
- name: Check OpenHPC availability
  block:

    # RedHat-family check
    - name: Check for OpenHPC repo (RedHat)
      when: ansible_os_family == "RedHat"
      stat:
        path: "/etc/yum.repos.d/openhpc*.repo"
      register: ohpc_repo_rh

    # SUSE check
    - name: Check for OpenHPC repo (SUSE)
      when: ansible_os_family == "Suse"
      command: zypper lr openhpc
      register: ohpc_repo_suse
      failed_when: false
      changed_when: false

    # Debian check
    - name: Check for OpenHPC repo (Debian)
      when: ansible_os_family == "Debian"
      command: grep -R "openhpc" /etc/apt/sources.list /etc/apt/sources.list.d/ || true
      register: ohpc_repo_deb
      changed_when: false

    # Decide availability
    - name: Set OpenHPC availability flag
      set_fact:
        openhpc_available: >-
          {{
            (ansible_os_family == "RedHat" and ohpc_repo_rh.stat.exists) or
            (ansible_os_family == "Suse" and ('openhpc' in ohpc_repo_suse.stdout)) or
            (ansible_os_family == "Debian" and ohpc_repo_deb.stdout != '')
          }}

# Skip message if not available
- name: Skipping OpenHPC install — not available
  debug:
    msg: "OpenHPC not available for {{ ansible_distribution }} {{ ansible_distribution_version }} — skipping installation."
  when: not openhpc_available

# Run OS-specific tasks only if available
- name: Include OS-specific OpenHPC tasks
  include_tasks: "{{ ansible_os_family }}.yml"
  when: openhpc_available
