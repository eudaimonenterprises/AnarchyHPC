---
# Load OS-specific vars
- name: Load OS-specific OpenHPC vars
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_os_family }}.yml"
    - "{{ ansible_distribution }}.yml"
    - "default.yml"

###############################################################################
# 1. Determine OpenHPC support
###############################################################################

- name: Determine OpenHPC support
  set_fact:
    openhpc_supported: >-
      {{
        (ansible_os_family == "Suse"
         and ansible_distribution_major_version | int <= 15)
        or
        (ansible_os_family == "RedHat")
        or
        (ansible_os_family == "Debian")
      }}

- name: Skipping OpenHPC — unsupported OS or disabled
  debug:
    msg: "OpenHPC not supported or disabled on {{ ansible_distribution }} {{ ansible_distribution_version }}"
  when: not openhpc_supported or not enable_openhpc

- name: Stop OpenHPC role when unsupported or disabled
  meta: end_host
  when: not openhpc_supported or not enable_openhpc

###############################################################################
# 2. Run OS-specific OpenHPC tasks
###############################################################################

- name: Include OS-specific OpenHPC tasks
  include_tasks: "{{ ansible_os_family }}.yml"

###############################################################################
# 3. Verify OpenHPC Slurm packages exist (optional safety)
###############################################################################

- name: Gather package facts
  package_facts:
  when: slurm_packages_ohpc | length > 0

- name: Filter OpenHPC Slurm packages to only those available
  set_fact:
    slurm_packages_ohpc: >-
      {{
        slurm_packages_ohpc
        | select('in', ansible_facts.packages.keys())
        | list
      }}
  when: slurm_packages_ohpc | length > 0
