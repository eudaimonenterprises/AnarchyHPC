---
###############################################################################
# 1. Determine whether OpenHPC is SUPPORTED on this OS
###############################################################################
# Supported:
#   - SUSE: Leap 15.x, SLES 15.x
#   - RedHat-family
#   - Debian-family
# Unsupported:
#   - SUSE Leap 16+
#   - SLES 16+ (future)
###############################################################################

- name: Determine OpenHPC support
  set_fact:
    openhpc_supported: >-
      {{
        # SUSE support only up to major version 15
        (ansible_os_family == "Suse"
         and ansible_distribution_major_version | int <= 15
         and ansible_distribution in ["openSUSE Leap", "SUSE Linux Enterprise Server", "SLES"])
        or
        # RedHat-family supported
        (ansible_os_family == "RedHat")
        or
        # Debian-family supported
        (ansible_os_family == "Debian")
      }}

- name: Skipping OpenHPC install — unsupported OS version
  debug:
    msg: "OpenHPC is NOT supported on {{ ansible_distribution }} {{ ansible_distribution_version }} — skipping."
  when: not openhpc_supported

- name: Stop OpenHPC processing when unsupported
  meta: end_play
  when: not openhpc_supported


###############################################################################
# 2. Detect whether OpenHPC is AVAILABLE (repo present)
#    This is separate from SUPPORT. A supported OS may not have the repo yet.
###############################################################################

- name: Check OpenHPC availability
  block:

    # RedHat-family check
    - name: Check for OpenHPC repo (RedHat)
      when: ansible_os_family == "RedHat"
      stat:
        path: "/etc/yum.repos.d/openhpc*.repo"
      register: ohpc_repo_rh

    # SUSE check
    - name: Check for OpenHPC repo (SUSE)
      when: ansible_os_family == "Suse"
      command: zypper lr openhpc
      register: ohpc_repo_suse
      failed_when: false
      changed_when: false

    # Debian check
    - name: Check for OpenHPC repo (Debian)
      when: ansible_os_family == "Debian"
      command: grep -R "openhpc" /etc/apt/sources.list /etc/apt/sources.list.d/ || true
      register: ohpc_repo_deb
      changed_when: false

    # Decide availability
    - name: Set OpenHPC availability flag
      set_fact:
        openhpc_available: >-
          {{
            (ansible_os_family == "RedHat" and ohpc_repo_rh.stat.exists)
            or
            (ansible_os_family == "Suse" and ('openhpc' in ohpc_repo_suse.stdout))
            or
            (ansible_os_family == "Debian" and ohpc_repo_deb.stdout != '')
          }}

- name: Skipping OpenHPC install — repo not available
  debug:
    msg: "OpenHPC repo not found on {{ ansible_distribution }} {{ ansible_distribution_version }} — skipping installation."
  when: not openhpc_available

- name: Stop OpenHPC processing when repo unavailable
  meta: end_play
  when: not openhpc_available


###############################################################################
# 3. Run OS-specific OpenHPC tasks
###############################################################################

- name: Include OS-specific OpenHPC tasks
  include_tasks: "{{ ansible_os_family }}.yml"
  when: openhpc_supported and openhpc_available
