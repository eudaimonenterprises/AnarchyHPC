---
- block:

    ###########################################################################
    # 1. Import OpenHPC GPG keys (Leap + SLES)
    ###########################################################################
    - name: Import OpenHPC GPG key (Leap 15)
      when:
        - ansible_distribution == "openSUSE Leap"
        - ansible_distribution_major_version | int == 15
      command: >
        rpm --import https://repos.openhpc.community/OpenHPC/3/Leap_15/repodata/repomd.xml.key
      changed_when: false
      failed_when: false

    - name: Import OpenHPC GPG key (SLES 15)
      when:
        - ansible_distribution in ["SUSE Linux Enterprise Server", "SLES"]
        - ansible_distribution_major_version | int == 15
      command: >
        rpm --import https://repos.openhpc.community/OpenHPC/3/SLE_15/repodata/repomd.xml.key
      changed_when: false
      failed_when: false


    ###########################################################################
    # 2. Add OpenHPC repo (Leap + SLES)
    ###########################################################################
    - name: Add OpenHPC repo for openSUSE Leap 15.x
      when:
        - ansible_distribution == "openSUSE Leap"
        - ansible_distribution_major_version | int == 15
      community.general.zypper_repository:
        name: openhpc
        repo: "https://repos.openhpc.community/OpenHPC/3/Leap_15"
        autorefresh: yes
        priority: 90

    - name: Add OpenHPC repo for SLES 15
      when:
        - ansible_distribution in ["SUSE Linux Enterprise Server", "SLES"]
        - ansible_distribution_major_version | int == 15
      community.general.zypper_repository:
        name: openhpc
        repo: "https://repos.openhpc.community/OpenHPC/3/SLE_15"
        autorefresh: yes
        priority: 90


    ###########################################################################
    # 3. Patch flaky Leap 15.6 SLE update repo BEFORE refresh
    ###########################################################################
    - name: Disable broken SLE update repo on Leap 15.6
      when:
        - ansible_distribution == "openSUSE Leap"
        - ansible_distribution_major_version | int == 15
      command: zypper mr -d repo-sle-update
      become: true
      changed_when: false
      failed_when: false


    ###########################################################################
    # 4. Refresh repos AFTER key import and repo patching
    ###########################################################################
    - name: Refresh zypper (ignore transient mirror failures)
      command: zypper --non-interactive refresh
      become: true
      changed_when: false
      failed_when: false


    ###########################################################################
    # 5. Install OpenHPC packages
    ###########################################################################
    - name: Install Lmod from OpenHPC repo
      community.general.zypper:
        name: lmod-ohpc
        state: present

    - name: Install pdsh from OpenHPC repo
      community.general.zypper:
        name:
          - pdsh-ohpc
          - pdsh-mod-genders-ohpc
          - pdsh-mod-slurm-ohpc
        state: present

  when: openhpc_supported

- name: Mark OpenHPC as managing the module system
  set_fact:
    openhpc_manages_modules: true
