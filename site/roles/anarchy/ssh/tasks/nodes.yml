---
- block:

    - name: Make .ssh root directory inside the image
      file:
        path: "{{ image_path }}/root/.ssh"
        mode: 0700
        owner: root
        group: root
        state: directory

    # ---------------------------------------------------------
    # CONTROLLER PUBLIC KEY
    # ---------------------------------------------------------

    - name: Ensure controller public key exists
      stat:
        path: /root/.ssh/id_rsa.pub
      register: controller_pubkey_stat

    - name: Fail if controller public key is missing
      fail:
        msg: "Controller public key /root/.ssh/id_rsa.pub does not exist on controller."
      when: not controller_pubkey_stat.stat.exists

    - name: Read controller public key
      become: true
      command: cat /root/.ssh/id_rsa.pub
      register: controller_pubkey
      changed_when: false

    - name: Add controller's key to authorized keys in the image
      authorized_key:
        user: root
        state: present
        key: "{{ controller_pubkey.stdout }}"
        path: "{{ image_path }}/root/.ssh/authorized_keys"

    # ---------------------------------------------------------
    # CLUSTER PUBLIC KEY (HA ONLY)
    # ---------------------------------------------------------

    - name: Ensure cluster public key exists (HA only)
      stat:
        path: /root/.ssh/id_cluster_rsa.pub
      register: cluster_pubkey_stat
      when: ha | default(False)

    - name: Fail if cluster public key is missing (HA only)
      fail:
        msg: "Cluster public key /root/.ssh/id_cluster_rsa.pub does not exist on controller."
      when:
        - ha | default(False)
        - not cluster_pubkey_stat.stat.exists

    - name: Read cluster public key
      become: true
      command: cat /root/.ssh/id_cluster_rsa.pub
      register: cluster_pubkey
      changed_when: false
      when: ha | default(False)

    - name: Add cluster key to authorized keys in the image
      authorized_key:
        user: root
        state: present
        key: "{{ cluster_pubkey.stdout }}"
        path: "{{ image_path }}/root/.ssh/authorized_keys"
      when: ha | default(False)

  when:
    - on_controller
    - extend_image | default(False)
    - image_path is defined
