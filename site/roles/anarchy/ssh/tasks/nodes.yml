- block:
  - name: Make .ssh root directory
    file:
      path: "{{ image_path }}/root/.ssh"
      mode: 0700
      owner: root
      group: root
      state: directory

  - name: Read controller public key
    become: true
    command: cat /root/.ssh/id_rsa.pub
    register: controller_pubkey
    changed_when: false

  - name: Add controller's key to authorized keys
    become: true
    authorized_key:
      user: root
      state: present
      key: "{{ controller_pubkey.stdout }}"
      path: "{{ image_path }}/root/.ssh/authorized_keys"

  - name: Read cluster public key
    become: true
    command: cat /root/.ssh/id_cluster_rsa.pub
    register: cluster_pubkey
    changed_when: false
    when: ha | default(False)

  - name: Add cluster key to authorized keys
    become: true
    authorized_key:
      user: root
      state: present
      key: "{{ cluster_pubkey.stdout }}"
      path: "{{ image_path }}/root/.ssh/authorized_keys"
    when: ha | default(False)

  when:
    - on_controller
    - extend_image | default(False)
    - image_path is defined
