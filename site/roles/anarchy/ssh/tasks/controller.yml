---
# tasks file for ssh

# ---------------------------------------------------------
# ENSURE SSH DIRECTORY EXISTS
# ---------------------------------------------------------

- name: Ensure /root/.ssh exists
  file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: 0700

# ---------------------------------------------------------
# CONTROLLER SSH KEY GENERATION (RELIABLE)
# ---------------------------------------------------------

- name: Generate controller SSH keypair if missing
  command: ssh-keygen -t rsa -b 4096 -f /root/.ssh/id_rsa -N ""
  args:
    creates: /root/.ssh/id_rsa

# ---------------------------------------------------------
# CLUSTER SSH KEY GENERATION (HA ONLY)
# ---------------------------------------------------------

- block:

    - name: Generate ssh cluster keys on the primary controller
      command: ssh-keygen -t rsa -b 4096 -f /root/.ssh/id_cluster_rsa -N ""
      args:
        creates: /root/.ssh/id_cluster_rsa

    - name: Ensure ssh keys sync directory exists
      file:
        path: '{{ anarchy_sync }}/ssh'
        state: directory

    - name: Add cluster ssh key to sync
      copy:
        remote_src: true
        src: '/root/.ssh/{{ item }}'
        dest: '{{ anarchy_sync }}/ssh/{{ item }}'
        mode: 0640
      with_items:
        - id_cluster_rsa
        - id_cluster_rsa.pub

  when:
    - primary | default(True)
    - ha | default(False)

# ---------------------------------------------------------
# CLUSTER KEY SYNC FOR SECONDARY CONTROLLERS
# ---------------------------------------------------------

- block:

    - name: Copy cluster ssh keys from sync
      copy:
        remote_src: true
        src: '{{ anarchy_sync }}/ssh/{{ item.0 }}'
        dest: '/root/.ssh/'
        mode: '{{ item.1 }}'
      with_together:
        - ['id_cluster_rsa', 'id_cluster_rsa.pub']
        - ['0600','0644']

    - name: Update ssh and sshd configuration files for cluster ssh
      copy:
        src: 'ssh_cluster_config'
        dest: '/root/.ssh/config'
        mode: '0644'
        owner: root
        group: root

  when:
    - not primary | default(False)
    - ha | default(False)

# ---------------------------------------------------------
# AUTHORIZED KEYS
# ---------------------------------------------------------

- name: Read controller public key
  become: true
  command: cat /root/.ssh/id_rsa.pub
  register: controller_pubkey
  changed_when: false

- name: Set authorized key for root on controller
  become: true
  authorized_key:
    user: root
    state: present
    key: "{{ controller_pubkey.stdout }}"

# ---------------------------------------------------------
# SSHD CONFIGURATION
# ---------------------------------------------------------

- name: Update ssh and sshd configuration files
  copy:
    src: '{{ item.0 }}'
    dest: '/etc/ssh/{{ item.0 }}'
    mode: '{{ item.1 }}'
    owner: root
    group: root
  with_together:
    - ['sshd_config', 'ssh_config']
    - ['0600', '0644']
  notify: restart sshd

- name: Start and enable sshd daemon
  service:
    name: sshd
    state: started
    enabled: true

# ---------------------------------------------------------
# USER SSH AUTO-CREATION SCRIPT
# ---------------------------------------------------------

- name: Automatic SSH key creation for user
  copy:
    src: "ssh.sh"
    dest: "/etc/profile.d/ssh.sh"
