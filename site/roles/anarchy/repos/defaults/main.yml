---
# Primary AnarchyHPC repositories (vendor-neutral placeholders)
anarchyhpc_repositories:
  - name: anarchyhpc
    repo: ""
    gpgcheck: False

# External repository RPMs (previously ClusterVision-hosted)
external_repository_rpms: []

# Package-based repositories (generic and safe)
package_based_repositories:
  - name: epel-release

# Custom repositories (empty by default)
custom_repositories: []

# Repositories that should use baseurl instead of mirrorlist
use_baseurl_repositories:
  - name: elrepo-release

# Repositories to disable by default
disable_repositories:
  - name: elrepo
  - name: elrepo-testing
  - name: elrepo-kernel
  - name: elrepo-extras

# Replace baseurls for specific repositories (generic mirror example)
replace_baseurls:
  - name: elrepo
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'
  - name: elrepo-testing
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'
  - name: elrepo-kernel
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'
  - name: elrepo-extras
    filter_url: 'http://elrepo.org'
    replace_url: 'http://linux-mirrors.fnal.gov'

#######################################################################
# AnarchyHPC distro-aware upstream repository mappings (NEW SECTION)
#######################################################################

# Upstream repository definitions per OS family
anarchyhpc_upstream_repos:
  redhat_family_9_plus:
    xcat: "https://download.opensuse.org/repositories/systemsmanagement:/xCAT:/Stable/RHEL_9/"
    openhpc: "http://build.openhpc.community/releases/2.13/RedHat_9/"

  debian_family_unstable:
    xcat: "http://repo.xcat.org/xcat-core/debian/unstable/"
    openhpc: "http://repo.xcat.org/openhpc/debian/unstable/"

# Map Ansible OS families to upstream repo sets
anarchyhpc_repository_map:
  RedHat: "{{ anarchyhpc_upstream_repos.redhat_family_9_plus }}"
  Rocky: "{{ anarchyhpc_upstream_repos.redhat_family_9_plus }}"
  AlmaLinux: "{{ anarchyhpc_upstream_repos.redhat_family_9_plus }}"
  Ubuntu: "{{ anarchyhpc_upstream_repos.debian_family_unstable }}"
  Debian: "{{ anarchyhpc_upstream_repos.debian_family_unstable }}"
