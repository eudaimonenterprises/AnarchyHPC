---
# Load OS‑specific variables
- name: Load a variable file based on the OS type, or a default if not found
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ ansible_os_family }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ ansible_distribution }}.yaml"
    - "{{ ansible_os_family }}.yaml"
  no_long: false
  ignore_errors: true

# ------------------------------------------------------------
# Step 2.2 — Dynamic Repository Resolution (NEW)
# ------------------------------------------------------------
- name: Set upstream repos based on OS family
  set_fact:
    active_repos: "{{ anarchyhpc_repository_map[ansible_os_family]
                      | default(anarchyhpc_upstream_repos.redhat_family_9_plus) }}"

# ------------------------------------------------------------
# RedHat-family repository configuration
# ------------------------------------------------------------
- block:

  - name: Rebuild RPM DB
    shell: "rpm --rebuilddb"
    ignore_errors: true

  - name: Configure AnarchyHPC repos
    ansible.builtin.yum_repository:
      name: "{{ item.name }}"
      description: "{{ item.name }}"
      baseurl: "{{ item.repo }}"
      gpgcheck: "{{ item.gpgcheck | default(False) }}"
      gpgkey: "file://{{ item.gpgkey | default('') }}"
      reposdir: "{{ params.install_root + '/etc/yum.repos.d/' if params.install_root is defined else '/etc/yum.repos.d' }}"
    with_items: "{{ anarchyhpc_repositories }}"
    when: item.name is defined

  - name: Configure gpg keys for AnarchyHPC repos
    copy:
      dest: "{{ item.gpgkey }}"
      content: "{{ item.gpgdata }}"
    with_items: "{{ anarchyhpc_repositories }}"
    when: item.gpgkey is defined and item.gpgdata is defined

  - name: Install external repo RPMS
    dnf:
      name: "{{ item.name }}"
      disable_gpg_check: "{{ item.no_gpgcheck | default(False) }}"
      state: present
      update_cache: true
      installroot: "{{ params.install_root if params.install_root is defined else '/' }}"
    retries: "{{ rpm_retries | default(3) }}"
    delay: "{{ rpm_delay | default(15) }}"
    with_items: "{{ external_repository_rpms }}"
    when: item.name is defined

  - ansible.builtin.include_tasks:
      file: mangling.yml

  - name: Install external repo Packages
    dnf:
      name: "{{ item.name }}"
      disable_gpg_check: "{{ item.no_gpgcheck | default(False) }}"
      state: present
      update_cache: true
      installroot: "{{ params.install_root if params.install_root is defined else '/' }}"
    retries: "{{ rpm_retries | default(3) }}"
    delay: "{{ rpm_delay | default(15) }}"
    with_items: "{{ package_based_repositories }}"
    when: item.name is defined

  - ansible.builtin.include_tasks:
      file: mangling.yml

  - name: Configure custom repos
    ansible.builtin.yum_repository:
      name: "{{ item.name }}"
      description: "{{ item.name }}"
      baseurl: "{{ item.repo }}"
      enabled: "{{ item.enabled | default(True) }}"
      gpgcheck: "{{ item.gpgcheck | default(False) }}"
      gpgkey: "file://{{ item.gpgkey | default('') }}"
      reposdir: "{{ params.install_root + '/etc/yum.repos.d/' if params.install_root is defined else '/etc/yum.repos.d' }}"
    with_items: "{{ custom_repositories }}"
    when: item.name is defined

  - name: Configure gpg keys for custom repos
    copy:
      dest: "{{ item.gpgkey }}"
      content: "{{ item.gpgdata }}"
    with_items: "{{ custom_repositories }}"
    when: item.gpgkey is defined and item.gpgdata is defined

  - name: Make caches
    shell: "dnf makecache -y"
    ignore_errors: true

  when: ansible_facts['os_family'] == "RedHat"
  tags: install-only

###############################################################################
# Debian-family repository configuration
###############################################################################

- block:

    - name: Ensure apt cache is updated
      apt:
        update_cache: yes

    - name: Configure xCAT upstream repo (APT)
      apt_repository:
        repo: "deb [trusted=yes] {{ active_repos.xcat }} ./"
        state: present

    - name: Configure OpenHPC upstream repo (APT)
      apt_repository:
        repo: "deb [trusted=yes] {{ active_repos.openhpc }} ./"
        state: present
      when: active_repos.openhpc is defined

    - name: Install required repo packages
      apt:
        name: "{{ item.name }}"
        state: present
        update_cache: yes
      loop: "{{ package_based_repositories }}"
      when: item.name is defined

    - name: Configure custom APT repos
      apt_repository:
        repo: "{{ item.repo }}"
        state: present
      loop: "{{ custom_repositories }}"
      when: item.repo is defined

    - name: Update apt cache after repo changes
      apt:
        update_cache: yes

  when: ansible_os_family == "Debian"
  tags: install-only
