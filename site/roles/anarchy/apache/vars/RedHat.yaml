---
# Apache Infrastructure for RedHat / RHEL 10
apache_service_name: "httpd"
apache_user: "apache"
apache_group: "apache"

# All Apache-specific modules and base packages
# Note: RHEL 10 often bundles many modules, but we explicitly list these for clarity
apache_packages:
  - httpd
  - mod_ssl
  - mod_perl

apache_service: httpd
apache_user: apache
apache_group: apache
apache_main_conf: /etc/httpd/conf/httpd.conf
apache_conf_dir: /etc/httpd/conf.d


apache_server_root: /etc/httpd
apache_log_dir: "logs"  # Default RHEL symlink to /var/log/httpd
apache_ssl_stapling_cache: "shmcb:logs/ssl_stapling(32768)"
apache_doc_root: "/var/www/html"   # Standard RedHat path
