- name: Run desktop task for OOD desktop app
  when: in_login_image|default(False) or on_controller
  block:

  - name: Render config file
    ansible.builtin.template:
      src: 'desktop/form.yml.j2'
      dest: /etc/ood/config/apps/bc_desktop/AnarchyHPC.yml
      owner: root
      group: root
      mode: "0644"
    when:
      - app.get('override') | default(override, true) | default(('etc/ood/config/apps/bc_desktop/AnarchyHPC.yml') is not exists, true)

  - name: Create submit directory
    ansible.builtin.file:
      path: /etc/ood/config/apps/bc_desktop/submit
      state: directory
      owner: root
      group: root
      mode: "0755"

  - name: Render config file
    ansible.builtin.template:
      src: 'desktop/submit.yml.erb.j2'
      dest: /etc/ood/config/apps/bc_desktop/submit/AnarchyHPC.yml.erb
      owner: root
      group: root
      mode: "0644"
    when:
      - app.get('override') | default(override, true) | default(('/etc/ood/config/apps/bc_desktop/submit/AnarchyHPC.yml.erb') is not exists, true)
