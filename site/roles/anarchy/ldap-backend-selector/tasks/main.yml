---
# site/roles/anarchy/ldap-backend-selector/tasks/main.yml

# Always honor the user's explicit choice.
# No OS gating. No automatic overrides.

- block:
    - name: Select OpenLDAP backend
      set_fact:
        anarchy_use_openldap: true
        anarchy_use_ds389: false
  when: anarchy_ldap_backend == 'openldap'

- block:
    - name: Select DS389 backend
      set_fact:
        anarchy_use_openldap: false
        anarchy_use_ds389: true
  when: anarchy_ldap_backend == 'ds389'

- debug:
    msg: "LDAP backend selection → OpenLDAP: {{ anarchy_use_openldap }}, DS389: {{ anarchy_use_ds389 }}"
  when:
    - anarchy_use_openldap is defined
    - anarchy_use_ds389 is defined
