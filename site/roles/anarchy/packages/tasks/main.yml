---
# Install additional packages and tunables

# ---------------------------------------------------------------------------
# Load OS‑specific package vars
# ---------------------------------------------------------------------------

- name: Load OS‑specific package vars
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ package_arch }}/{{ ansible_distribution }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ package_arch }}/{{ ansible_os_family }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ package_arch }}/{{ ansible_distribution }}.yaml"
    - "{{ package_arch }}/{{ ansible_os_family }}.yaml"
    - "default.yaml"
  no_log: false

# ---------------------------------------------------------------------------
# Import repo GPG key BEFORE any zypper operations
# ---------------------------------------------------------------------------

- name: Import science repo GPG key (safe for all openSUSE versions)
  when: ansible_os_family == "Suse"
  command: >
    rpm --import https://download.opensuse.org/repositories/science/openSUSE_Leap_{{ ansible_distribution_version }}/repodata/repomd.xml.key
  failed_when: false
  changed_when: false

# ---------------------------------------------------------------------------
# Import missing GPG keys for all SUSE repos
# ---------------------------------------------------------------------------

- name: Get list of repos with missing GPG keys
  when: ansible_os_family == "Suse"
  command: zypper --non-interactive --gpg-auto-import-keys refresh
  register: zypper_refresh
  failed_when: false
  changed_when: false

# ---------------------------------------------------------------------------
# Check which packages actually exist
# ---------------------------------------------------------------------------

- name: Check if package exists
  when: ansible_os_family == "Suse"
  command: "zypper --non-interactive se {{ item }}"
  register: pkg_check
  failed_when: false
  changed_when: false
  loop: "{{ install_packages }}"
  ignore_errors: yes

# ---------------------------------------------------------------------------
# Install only packages that exist
# ---------------------------------------------------------------------------

- name: Install only packages that exist (SUSE)
  when: ansible_os_family == "Suse"
  zypper:
    name: "{{ item.item }}"
    state: present
    disable_recommends: yes
    no_gpg_check: no
    disable_repo: openhpc-hpc
  loop: "{{ pkg_check.results | selectattr('stdout', 'search', 'package.*found') | list }}"
  ignore_errors: yes
  tags: install-only


# ---------------------------------------------------------------------------
# Install packages on Ubuntu/Debian (apt)
# ---------------------------------------------------------------------------

- name: Update apt cache
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install additional packages (Ubuntu/Debian)
  apt:
    name: "{{ item }}"
    state: present
  loop: "{{ install_packages }}"
  when: ansible_os_family == "Debian"
  tags: install-only

# ---------------------------------------------------------------------------
# Install packages on RHEL-family (yum/dnf)
# ---------------------------------------------------------------------------

- name: Install additional packages (RHEL / Rocky / Alma)
  package:
    name: "{{ item }}"
    state: present
    enablerepo:
      - powertools
      - crb
      - codeready-builder-for-rhel-*-x86_64-rpm
      - codeready-builder-for-rhel-*-aarch64-rpm
    disable_gpg_check: true
  loop: "{{ install_packages }}"
  when: ansible_os_family == "RedHat"
  tags: install-only
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

# ---------------------------------------------------------------------------
# Enable haveged (exists on all OSes)
# ---------------------------------------------------------------------------

- name: Enable haveged service
  service:
    name: haveged
    enabled: true

- name: Start haveged service
  service:
    name: haveged
    state: started
  when: not in_image
