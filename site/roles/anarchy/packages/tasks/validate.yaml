---
# Step 3.3 — Drift Detection
# Validate that installed packages match the lockfile exactly

###############################################################################
# 1. Load lockfile for this OS + role
###############################################################################

- name: Load lockfile for this OS + role
  include_vars:
    file: "{{ lockfile_path }}"
  vars:
    lockfile_path: "site/roles/anarchy/packages/locks/{{ os_family }}_{{ node_role }}.lock.yaml"

###############################################################################
# 2. Query installed package versions
###############################################################################

- name: Query installed package versions
  command: "rpm -q {{ item.name }} --qf '%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n'"
  register: pkg_query
  loop: "{{ packages }}"
  changed_when: false

###############################################################################
# 3. Build installed version map
###############################################################################

- name: Build installed version map
  set_fact:
    installed_versions: "{{ installed_versions | default({}) | combine({ item.stdout.split()[0]: item.stdout.split()[1] }) }}"
  loop: "{{ pkg_query.results }}"

###############################################################################
# 4. Validate installed versions match lockfile
###############################################################################

- name: Validate installed versions match lockfile
  assert:
    that:
      - installed_versions[item.name] == item.version
    fail_msg: >
      Package {{ item.name }} is {{ installed_versions[item.name] }},
      but lockfile requires {{ item.version }}.
  loop: "{{ packages }}"
