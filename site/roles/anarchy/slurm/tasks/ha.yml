---
- name: Add Slurm Pacemaker resources
  pcs_resource:
    name: "{{ item }}"
    resource_class: "systemd"
    resource_type: "systemd:{{ item }}"
    options: "meta migration-threshold=3 failure-timeout=120s op monitor interval=30 --group Anarchy-stack"
    state: present
  loop:
    - munge
    - slurmdbd
    - slurmctld
  tags: pcs
