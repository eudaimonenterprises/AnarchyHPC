---
# The Luna exporter is deprecated and no longer used.
# This role remains only as a placeholder to avoid breaking playbooks.

prometheus_luna_exporter_enabled: false

prometheus_luna_exporter_version: "0.0.0"
prometheus_luna_exporter_binary_url: ""

prometheus_luna_exporter_web_listen_port: "14210"
prometheus_luna_exporter_web_listen_host: "0.0.0.0"

prometheus_luna_exporter_log_dir: "/var/log/prometheus"

prometheus_luna_exporter_binary_install_dir: "/usr/local/bin"

prometheus_luna_exporter_system_user: "root"
prometheus_luna_exporter_system_group: "root"
prometheus_luna_exporter_additional_system_groups: []

prometheus_luna_exporter_packages: []
