---
###############################################################################
# 1. Define nodes in xCAT
###############################################################################

- name: Define nodes in xCAT
  ansible.builtin.command: >
    mkdef -t node -o {{ item.name }}
    ip={{ item.ip }}
    mac={{ item.mac }}
    groups={{ item.groups | join(',') }}
    osimage={{ item.osimage }}
  loop: "{{ xcat_nodes }}"
  when: xcat_nodes | length > 0

###############################################################################
# 2. Configure BMC/IPMI (optional)
###############################################################################

- name: Configure BMC settings for nodes
  ansible.builtin.command: >
    chdef {{ item.name }}
    bmc={{ item.bmc_ip }}
    bmcusername={{ item.bmc_user }}
    bmcpassword={{ item.bmc_pass }}
  loop: "{{ xcat_nodes }}"
  when:
    - item.bmc_ip is defined
    - item.bmc_user is defined
    - item.bmc_pass is defined

###############################################################################
# 3. HPC node configuration (image-side)
###############################################################################

- block:
    - name: Ensure node image config directory exists
      ansible.builtin.file:
        path: "{{ image_path }}/etc/hpc/"
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Deploy HPC node configuration into image
      ansible.builtin.template:
        src: "hpc-node.conf.j2"
        dest: "{{ image_path }}/etc/hpc/node.conf"
        owner: root
        group: root
        mode: 0644
  when:
    - image_path is defined
    - on_controller | default(false)

###############################################################################
# 4. HPC node configuration (live node)
###############################################################################

- block:
    - name: Ensure HPC config directory exists on node
      ansible.builtin.file:
        path: "/etc/hpc/"
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Deploy HPC node configuration
      ansible.builtin.template:
        src: "hpc-node.conf.j2"
        dest: "/etc/hpc/node.conf"
        owner: root
        group: root
        mode: 0644
  when:
    - in_image | default(false) or on_node | default(false)
