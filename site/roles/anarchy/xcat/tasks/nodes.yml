---
# xCAT node definitions - production-grade with full idempotency

###############################################################################
# 1. Node creation and update (idempotent)
###############################################################################

- name: Define compute nodes in xCAT (fully idempotent)
  include_tasks: nodes-define.yml
  loop: "{{ xcat_nodes }}"
  loop_control:
    loop_var: item
  when:
    # Use the global variables you already verified
    - provisioning_enabled | default(false) | bool
    - provisioning_method == 'xcat'
    # Only run if we are actually on the controller
    - on_controller | default(false) | bool

###############################################################################
# 2. BMC Configuration (idempotent + credential validation)
###############################################################################

- name: Configure node BMC settings (idempotent)
  include_tasks: nodes-bmc.yml
  loop: "{{ xcat_nodes }}"
  loop_control:
    loop_var: item
  when:
    - xcat_check.rc == 0
    - provisioning_method == 'xcat'


###############################################################################
# 3. PXE Options Configuration (idempotent)
###############################################################################

- name: Configure PXE boot options (idempotent)
  include_tasks: nodes-pxe.yml
  loop: "{{ xcat_nodes }}"
  loop_control:
    loop_var: item
  when:
    - xcat_check.rc == 0
    - provisioning_method == 'xcat'

###############################################################################
# 4. HPC node configuration (image-side)
###############################################################################

- block:
    - name: Ensure node image config directory exists
      ansible.builtin.file:
        path: "{{ image_path }}/etc/hpc/"
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Deploy HPC node configuration into image
      ansible.builtin.template:
        src: "hpc-node.conf.j2"
        dest: "{{ image_path }}/etc/hpc/node.conf"
        owner: root
        group: root
        mode: 0644
  when:
    - image_path is defined
    - on_controller | default(false)

###############################################################################
# 5. HPC node configuration (live node)
###############################################################################

- block:
    - name: Ensure HPC config directory exists on node
      ansible.builtin.file:
        path: "/etc/hpc/"
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Deploy HPC node configuration
      ansible.builtin.template:
        src: "hpc-node.conf.j2"
        dest: "/etc/hpc/node.conf"
        owner: root
        group: root
        mode: 0644
  when:
    - in_image | default(false) or on_node | default(false)