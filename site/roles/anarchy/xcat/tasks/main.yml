---
- name: Load OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_os_family }}{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_os_family }}.yaml"
      paths:
        - "../vars"

###############################################################################
# Pre-flight: Only run xCAT provisioning if enabled and selected
###############################################################################
- block:

    - name: Show provisioning mode
      debug:
        msg: "xCAT provisioning enabled (method={{ provisioning_method }})"

  when:
    - provisioning_enabled | default(false) | bool
    - provisioning_method | default('xcat') == 'xcat'


###############################################################################
# Controller tasks
###############################################################################
- block:

    ###########################################################################
    # Phase 0: Controller Health Validation (original main.yml)
    ###########################################################################

    - name: Check DNS resolution
      command: "getent hosts {{ mgmt_hostname | default(ansible_fqdn) }}"
      register: dns_check
      failed_when: dns_check.rc != 0

    - name: Check DHCP config syntax
      command: "{{ xcat_sbin }}/makedhcp -n"
      environment:
        XCATROOT: "/opt/xcat"
      become: true

    - name: Validate TFTP directory exists
      stat:
        path: /tftpboot
      register: tftp_dir
      failed_when: not tftp_dir.stat.exists

    - name: Validate node definitions exist
      command: "{{ xcat_bin }}/lsdef -t node"
      environment:
        XCATROOT: "/opt/xcat"
        XCATBYPASS: "1"
      register: node_defs
      failed_when: node_defs.rc != 0
      become: true

    ###########################################################################
    # Phase A: Install xCAT + ensure directories
    ###########################################################################

    - name: Install xCAT packages
      include_tasks: install.yml

    - name: Ensure xCAT directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      loop:
        - "{{ xcat_install_dir | default('/opt/xcat') }}"
        - "{{ xcat_config_dir | default('/etc/xcat') }}"

    ###########################################################################
    # Phase A2: Configure xCAT networking + services (RESTORED)
    ###########################################################################

    - name: Configure xCAT networks (DHCP, DNS, TFTP)
      include_tasks: networks.yml

    - name: Configure xCAT services
      include_tasks: services.yml

    ###########################################################################
    # Phase B: Config Injection (postscripts)
    ###########################################################################

    - name: Inject post-install configuration scripts
      include_tasks: postscripts.yml

    ###########################################################################
    # Phase C: Source Setup (copycds → repo creation)
    ###########################################################################

    - name: Configure ISO source and repository
      include_tasks: images.yml

    ###########################################################################
    # Phase D: Object Definition (mkdef)
    ###########################################################################

    - name: Define OS images in xCAT
      include_tasks: define_image.yml

    ###########################################################################
    # Phase E: Build & Seal (genimage + packimage)
    ###########################################################################

    - name: Build and seal bootable OS images
      include_tasks: build_seal.yml

    ###########################################################################
    # Phase F: Zero-touch Trigger (nodeset + nextstate=prov)
    ###########################################################################

    - name: Assign compute nodes and trigger provisioning
      include_tasks: assign_nodes.yml

    ###########################################################################
    # Phase G: Post-flight Validation (original main.yml)
    ###########################################################################

    - name: Ping all compute nodes
      command: "{{ xcat_bin }}/nodels {{ groups['compute'] | join(',') }} -s ping"
      environment:
        XCATROOT: "/opt/xcat"
      register: ping_check
      failed_when: ping_check.rc != 0
      become: true
      when: groups['compute'] | default([]) | length > 0

    - name: Validate xCAT metadata consistency
      command: "{{ xcat_bin }}/lsdef -t node -o {{ item }}"
      environment:
        XCATROOT: "/opt/xcat"
      loop: "{{ groups['compute'] | default([]) }}"
      register: metadata_check
      failed_when: metadata_check.failed
      become: true
      when: groups['compute'] | default([]) | length > 0

    ###########################################################################
    # Phase H: Finalization (DHCP/DNS/TFTP regeneration)
    ###########################################################################

    - name: Finalize provisioning
      include_tasks: finalize.yml
      when: xcat_validate_final_state | default(true)

  when:
    - provisioning_enabled | default(false) | bool
    - provisioning_method | default('xcat') == 'xcat'
    - (on_controller | default(false) | bool)


###############################################################################
# Compute node tasks
###############################################################################
- block:

    - name: Configure compute nodes
      include_tasks: nodes.yml

  when:
    - provisioning_enabled | default(false) | bool
    - provisioning_method | default('xcat') == 'xcat'
    - not (on_controller | default(true) | bool)
