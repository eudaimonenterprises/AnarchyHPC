---
# Define xCAT OS images (Phase D of the provisioning pipeline)

- name: "Define xCAT OS images"
  block:

    - name: "Check if OS image {{ item.name }} exists"
      command: "{{ xcat_bin }}/lsdef -t osimage -o {{ item.name }}"
      changed_when: false
      failed_when: false
      register: existing_image

    ###########################################################################
    # Build mkdef command dynamically
    ###########################################################################

    - name: "Build mkdef command for {{ item.name }}"
      set_fact:
        mkdef_cmd: >
          {{ xcat_bin }}/mkdef -t osimage -o {{ item.name }}
          osvers={{ item.osvers }}
          arch={{ item.arch | default('x86_64') }}
          profile={{ item.profile | default('compute') }}
          provmethod={{ item.provmethod | default('netboot') }}
          imagetype=linux
          rootimgdir={{ item.rootimgdir | default(anarchy_images ~ '/' ~ item.name) }}
          pkglist={{ item.pkglist | default(xcat_pkgdir ~ '/' ~ item.os_family ~ '/compute.pkglist') }}
          template={{ item.template | default(osimage_defaults.template) }}
          postinstall={{ item.postinstall | default('/install/postscripts/config/root-password.sh,/install/postscripts/config/authorized-keys.sh,/install/postscripts/config/dns-setup.sh,/install/postscripts/config/timezone-setup.sh') }}
          postscript={{ item.postscript | default('') }}

    ###########################################################################
    # Create or update the osimage definition
    ###########################################################################

    - name: "Create OS image {{ item.name }} if missing"
      command: "{{ mkdef_cmd }}"
      when: existing_image.rc != 0
      register: mkdef_result

    - name: "Update OS image {{ item.name }} if it exists"
      command: >
        {{ xcat_bin }}/chdef -t osimage -o {{ item.name }}
        rootimgdir={{ item.rootimgdir | default(anarchy_images ~ '/' ~ item.name) }}
        pkglist={{ item.pkglist | default(xcat_pkgdir ~ '/' ~ item.os_family ~ '/compute.pkglist') }}
        postinstall={{ item.postinstall | default('/install/postscripts/config/root-password.sh,/install/postscripts/config/authorized-keys.sh,/install/postscripts/config/dns-setup.sh,/install/postscripts/config/timezone-setup.sh') }}
        postscript={{ item.postscript | default('') }}
      when: existing_image.rc == 0
      register: chdef_result

    ###########################################################################
    # Mark whether the image definition changed (used by build_seal.yml)
    ###########################################################################

    - name: "Record whether {{ item.name }} definition changed"
      set_fact:
        osimage_changed: "{{ (mkdef_result.changed | default(false)) or (chdef_result.changed | default(false)) }}"

  loop: "{{ xcat_os_images }}"
  loop_control:
    label: "{{ item.name }}"
