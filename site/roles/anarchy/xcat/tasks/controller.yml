---
# xCAT Controller – Modernized Provisioning Pipeline

###############################################################################
# 0. Load OS-specific variables
###############################################################################

- name: Load OS-specific vars (if any)
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}{{ ansible_distribution_major_version }}.yaml"
    - "{{ ansible_os_family }}{{ ansible_distribution_major_version }}.yaml"
  no_long: false
  ignore_errors: true

###############################################################################
# 1. Base packages / repos
###############################################################################

- name: Ensure xCAT repo is configured (RedHat family example)
  template:
    src: xcat.repo.j2
    dest: /etc/yum.repos.d/xcat.repo
    owner: root
    group: root
    mode: 0644
  when: ansible_os_family == "RedHat"

- name: Install xCAT server and client packages
  package:
    name: "{{ provisioning_required_packages | default(['xcat-server','xcat-client','xcat-genesis-scripts-x86_64','xcat-genesis-base-x86_64']) }}"
    state: present
  retries: "{{ rpm_retries | default(3) }}"
  delay: "{{ rpm_delay | default(15) }}"

- name: Ensure xCAT directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop:
    - "{{ xcat_install_dir | default('/opt/xcat') }}"
    - "{{ xcat_config_dir | default('/etc/xcat') }}"

###############################################################################
# 2. Core xCAT services
###############################################################################

- name: Enable and start xcatd
  service:
    name: xcatd
    state: started
    enabled: true

###############################################################################
# 3. Provisioning Pipeline (NEW)
###############################################################################
# This replaces the old ad‑hoc commands with a real orchestration pipeline.

# --- Pre-flight validation ----------------------------------------------------

- name: Pre-flight validation before provisioning
  import_tasks: roles/anarchy/xcat/tasks/preflight.yml
  when: provisioning_pre_validation | default(true)
  tags: [provisioning, preflight]

# --- xCAT role (networks, images, nodes, services) ----------------------------

- name: Run xCAT provisioning role
  role: anarchy/xcat
  vars:
    provisioning_pre_validation: true
    xcat_build_images_if_missing: true
    xcat_deploy_nodes_auto: true
    xcat_validate_final_state: true
  tags: [provisioning, xcat]

# --- Image build orchestration ------------------------------------------------

- name: Build OS images if missing or outdated
  import_tasks: roles/anarchy/xcat/tasks/build-images.yml
  when: xcat_build_images_if_missing | default(true)
  tags: [provisioning, images]

# --- Node deployment ----------------------------------------------------------

- name: Deploy nodes (assign osimage, configure PXE, trigger install)
  import_tasks: roles/anarchy/xcat/tasks/deploy-nodes.yml
  when: xcat_deploy_nodes_auto | default(true)
  tags: [provisioning, nodes]

# --- Final validation ---------------------------------------------------------

- name: Validate final provisioning state
  import_tasks: roles/anarchy/xcat/tasks/finalize.yml
  when: xcat_validate_final_state | default(true)
  tags: [provisioning, finalize]

###############################################################################
# 4. Post-setup wait (optional)
###############################################################################

- name: Wait a bit for xcatd to settle
  wait_for:
    timeout: 10
