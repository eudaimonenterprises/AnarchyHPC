---
# xCAT Controller – Modernized Provisioning Pipeline

- name: Ensure xCAT directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop:
    - "{{ xcat_install_dir | default('/opt/xcat') }}"
    - "{{ xcat_config_dir | default('/etc/xcat') }}"

###############################################################################
# 2. Core xCAT services
###############################################################################

- name: Enable and start xcatd
  service:
    name: xcatd
    state: started
    enabled: true
