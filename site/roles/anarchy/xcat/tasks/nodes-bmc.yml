  block:

    ###########################################################################
    # 2.1 Validate BMC credentials (non-fatal)
    ###########################################################################

    - name: Validate BMC credentials
      command: >
        ipmitool -I lanplus -H {{ item.bmc_ip }}
        -U {{ bmc_default_user | default('admin') }}
        -P {{ bmc_default_pass | default('') }}
        chassis status
      register: bmc_check
      changed_when: false
      failed_when: false
      when: item.bmc_ip is defined

    - name: Skip BMC update if credentials invalid
      debug:
        msg: "Skipping BMC update for {{ item.name }}: invalid credentials"
      when:
        - item.bmc_ip is defined
        - "'Error' in bmc_check.stderr or 'failed' in bmc_check.stdout"

    ###########################################################################
    # 2.2 Update BMC settings only if valid and changed
    ###########################################################################

    - name: Get current BMC config
      command: lsdef -t node {{ item.name }} | grep bmc=
      changed_when: false
      failed_when: false
      register: existing_bmc_config
      when:
        - item.bmc_ip is defined
        - "'Error' not in bmc_check.stderr"

    - name: Update BMC IP if needed
      command: chdef -t node {{ item.name }} bmc={{ item.bmc_ip }}
      register: bmc_update
      changed_when: bmc_update.rc == 0
      failed_when: bmc_update.rc != 0
      when:
        - item.bmc_ip is defined
        - "'Error' not in bmc_check.stderr"
        - existing_bmc_config.stdout is not regex("bmc={{ item.bmc_ip }}\\b")

    ###########################################################################
    # 2.3 Verify BMC configuration
    ###########################################################################

    - name: Verify BMC configuration
      command: lsdef -t node {{ item.name }} | grep bmc={{ item.bmc_ip }}
      register: bmc_verify
      changed_when: false
      failed_when: bmc_verify.rc != 0
      when:
        - item.bmc_ip is defined
        - "'Error' not in bmc_check.stderr"
