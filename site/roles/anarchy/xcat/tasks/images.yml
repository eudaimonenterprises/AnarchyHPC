---
# xCAT OS image definitions - production-grade with idempotency

###############################################################################
# 0. Pre-flight: ensure xCAT is installed
###############################################################################

- name: Verify xCAT installation before image configuration
  command: which lsdef
  changed_when: false
  failed_when: false
  register: xcat_check


###############################################################################
# 1. Discover pkgdir (Updated for /opt/xcat/share/xcat layout)
###############################################################################

- name: Check for existence of xCAT pkgdir paths
  stat:
    path: "{{ item }}"
  loop:
    - "/opt/xcat/share/xcat/install"
    - "/opt/xcat/share/xcat/netboot"
    - "/install/nodetypes"
  register: pkgdir_stats

- name: Set xcat_pkgdir from first existing path
  set_fact:
    xcat_pkgdir: "{{ (pkgdir_stats.results | selectattr('stat.exists', 'true') | map(attribute='item') | list)[0] }}"
  failed_when: xcat_pkgdir is not defined


###############################################################################
# 2. Pre-Build Validation (NEW)
###############################################################################

- name: Validate .pkglist file exists before genimage
  stat:
    # Use the os_family you already defined in your xcat_os_images list
    path: "{{ xcat_pkgdir }}/{{ image_item.os_family }}/compute.pkglist"
  register: pkglist_check
  failed_when: not pkglist_check.stat.exists
  # The [ ] | flatten ensures the loop gets a list even if only one item is active
  loop: "{{ [xcat_os_images] | flatten }}"
  loop_control:
    loop_var: image_item
    label: "Validate {{ image_item.name }} .pkglist"

- name: Validate postscript shell scripts exist before genimage
  stat:
    path: "/install/postscripts/config/{{ item }}"
  register: postscript_check
  failed_when: not postscript_check.stat.exists
  loop:
    - root-password.sh
    - authorized-keys.sh
    - dns-setup.sh
    - timezone-setup.sh

- name: Confirm pre-build validation passed
  debug:
    msg: "Pre-build validation successful. All .pkglist and postscripts ready."


###############################################################################
# 3. OS-family defaults (RedHat / Suse / Debian)
###############################################################################

- name: Select OS-family-specific image defaults
  set_fact:
    osimage_defaults: "{{ item.defaults }}"
  loop:
    - os_family: 'RedHat'
      defaults:
        pkgdir: "{{ xcat_pkgdir }}"
        template: "/opt/xcat/share/xcat/install/rh/compute.pkglist"
        imagetype: 'install'
    - os_family: 'Suse'
      defaults:
        pkgdir: "{{ xcat_pkgdir }}"
        template: "/opt/xcat/share/xcat/install/sles/compute.pkglist"
        imagetype: 'install'
    - os_family: 'Debian'
      defaults:
        pkgdir: "{{ xcat_pkgdir }}"
        template: "/opt/xcat/share/xcat/install/debian/compute.pkglist"
        imagetype: 'install'
  when: 
    - osimage_defaults is not defined
    - item.os_family == ansible_os_family


###############################################################################
# 4. Define OS images (Flattened to avoid Block/Include errors)
###############################################################################

- name: "Check if OS image {{ image_item.name }} exists"
  command: "{{ xcat_bin | default('/opt/xcat/bin') }}/lsdef -t osimage -o {{ image_item.name }}"
  changed_when: false
  failed_when: false
  register: existing_images
  loop: "{{ [xcat_os_images] | flatten }}"
  loop_control:
    loop_var: image_item
  when: xcat_check.rc == 0 and provisioning_method | default('xcat') == 'xcat'

- name: "Create OS image if missing"
  command: >
    {{ xcat_bin | default('/opt/xcat/bin') }}/mkdef -t osimage -o {{ item.image_item.name }}
    osvers={{ item.image_item.osvers }}
    arch={{ item.image_item.arch | default('x86_64') }}
    profile={{ item.image_item.profile | default('compute') }}
    provmethod={{ item.image_item.provmethod | default('netboot') }}
    imagetype=linux
    pkglist={{ xcat_pkgdir }}/{{ item.image_item.os_family }}/compute.pkglist
    template={{ item.image_item.template | default(xcat_pkgdir ~ '/rh/compute.pkglist') }}
  loop: "{{ existing_images.results }}"
  loop_control:
    label: "Creating {{ item.image_item.name | default('unknown') }}"
  when: 
    - not item.skipped | default(false)
    - item.rc != 0

- name: "Update OS image if it exists"
  command: >
    {{ xcat_bin | default('/opt/xcat/bin') }}/chdef -t osimage -o {{ item.image_item.name }}
    pkglist={{ xcat_pkgdir }}/{{ item.image_item.os_family }}/compute.pkglist
  loop: "{{ existing_images.results }}"
  loop_control:
    label: "Updating {{ item.image_item.name | default('unknown') }}"
  when: 
    - not item.skipped | default(false)
    - item.rc == 0

###############################################################################
# 5. Build & Seal OS Images (Restored from Phase E)
###############################################################################

- name: "Run genimage for {{ item.image_item.name }}"
  command: "{{ xcat_bin | default('/opt/xcat/bin') }}/genimage {{ item.image_item.name }}"
  environment:
    XCATROOT: "/opt/xcat"
  loop: "{{ existing_images.results }}"
  loop_control:
    label: "genimage: {{ item.image_item.name | default('unknown') }}"
  when: 
    - not item.skipped | default(false)
    - osimage_changed | default(true) | bool

- name: "Run packimage for {{ item.image_item.name }}"
  command: "{{ xcat_bin | default('/opt/xcat/bin') }}/packimage {{ item.image_item.name }}"
  environment:
    XCATROOT: "/opt/xcat"
  loop: "{{ existing_images.results }}"
  loop_control:
    label: "packimage: {{ item.image_item.name | default('unknown') }}"
  when: 
    - not item.skipped | default(false)
    - osimage_changed | default(true) | bool
