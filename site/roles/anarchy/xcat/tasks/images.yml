---
# xCAT OS image definitions - production-grade with idempotency

###############################################################################
# 0. Pre-flight: ensure xCAT is installed
###############################################################################

- name: Verify xCAT installation before image configuration
  command: which lsdef
  changed_when: false
  failed_when: false
  register: xcat_check

###############################################################################
# 1. Discover pkgdir (Updated for /opt/xcat/share/xcat layout)
###############################################################################

- name: Determine appropriate pkgdir based on architecture and OS family
  set_fact:
    xcat_pkgdir: "{{ item }}"
  loop:
    - "/opt/xcat/share/xcat/install"
    - "/opt/xcat/share/xcat/netboot"
    - "/install/nodetypes"
  when: 
    - xcat_pkgdir is not defined
    - item is directory

###############################################################################
# 2. OS-family defaults (RedHat / Suse / Debian)
###############################################################################

- name: Select OS-family-specific image defaults
  set_fact:
    osimage_defaults: "{{ item.defaults }}"
  loop:
    - os_family: 'RedHat'
      defaults:
        pkgdir: "{{ xcat_pkgdir }}"
        template: "/opt/xcat/share/xcat/install/rh/compute.pkglist"
        imagetype: 'install'
    - os_family: 'Suse'
      defaults:
        pkgdir: "{{ xcat_pkgdir }}"
        template: "/opt/xcat/share/xcat/install/sles/compute.pkglist"
        imagetype: 'install'
    - os_family: 'Debian'
      defaults:
        pkgdir: "{{ xcat_pkgdir }}"
        template: "/opt/xcat/share/xcat/install/debian/compute.pkglist"
        imagetype: 'install'
  when: 
    - osimage_defaults is not defined
    - item.os_family == ansible_os_family

###############################################################################
# 3. Define OS images (Using include_tasks to solve the 'Block Loop' error)
###############################################################################

- name: Process xCAT OS image definitions
  include_tasks: define_image.yml
  loop: "{{ xcat_os_images | default([]) }}"
  loop_control:
    loop_var: image_item
  when:
    - xcat_check.rc == 0
    - provisioning_method | default('xcat') == 'xcat'
