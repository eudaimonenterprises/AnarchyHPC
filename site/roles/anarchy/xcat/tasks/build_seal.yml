---
# Phase E: Build & Seal OS Images (genimage + packimage)

- name: "Begin build & seal process for all OS images"
  debug:
    msg: "Starting genimage + packimage for defined OS images"


###############################################################################
# Loop through all defined OS images
###############################################################################

- name: "Run genimage for {{ item.name }}"
  command: >
    {{ xcat_bin }}/genimage {{ item.name }}
  environment:
    XCATROOT: "/opt/xcat"
  register: genimage_result
  failed_when: genimage_result.rc != 0
  when:
    - osimage_changed | default(true) | bool
  loop: "{{ xcat_os_images }}"
  loop_control:
    label: "{{ item.name }}"


- name: "Run packimage for {{ item.name }}"
  command: >
    {{ xcat_bin }}/packimage {{ item.name }}
  environment:
    XCATROOT: "/opt/xcat"
  register: packimage_result
  failed_when: packimage_result.rc != 0
  when:
    - osimage_changed | default(true) | bool
  loop: "{{ xcat_os_images }}"
  loop_control:
    label: "{{ item.name }}"


###############################################################################
# Final confirmation
###############################################################################

- name: "Confirm build & seal completed"
  debug:
    msg: "genimage + packimage completed successfully for all OS images."
