---
# 1. Add Repositories (SUSE)
- name: Add xCAT repositories (SUSE)
  zypper_repository:
    name: "{{ item.name }}"
    repo: "{{ item.url }}"
    auto_import_keys: yes
    state: present
  loop:
    - { name: 'xcat-core', url: "{{ xcat_core_repo_url }}" }
    - { name: 'xcat-dep', url: "{{ xcat_dep_repo_url }}" }
  when: ansible_os_family == "Suse"

# 2. Add Repositories (RedHat)
- name: Add xCAT repositories (RedHat)
  yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.name }} Repository"
    baseurl: "{{ item.url }}"
    gpgcheck: no
  loop:
    - { name: 'xcat-core', url: "{{ xcat_core_repo_url }}" }
    - { name: 'xcat-dep', url: "{{ xcat_dep_repo_url }}" }
  when: ansible_os_family == "RedHat"

# 3. Add Repositories (Debian)
- name: Add xCAT repositories (Debian)
  apt_repository:
    repo: "{{ item }}"
    state: present
  loop:
    - "{{ xcat_core_repo_url }}"
    - "{{ xcat_dep_repo_url }}"
  when: ansible_os_family == "Debian"

# 4. Install Packages (Unified)
- name: Install xCAT and auxiliary tools
  package:
    name: "{{ provisioning_required_packages }}"
    state: present
