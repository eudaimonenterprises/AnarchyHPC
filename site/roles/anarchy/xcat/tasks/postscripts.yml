---
# Phase C: Inject post-install configuration scripts for xCAT OS images

- name: Ensure postscripts directory exists
  file:
    path: "/install/postscripts/config"
    state: directory
    owner: root
    group: root
    mode: 0755


###############################################################################
# Generate SSH keypair on controller (idempotent)
###############################################################################

- name: Ensure xCAT SSH key directory exists
  file:
    path: /etc/xcat/sshkeys
    state: directory
    owner: root
    group: root
    mode: 0700

- name: Generate root SSH keypair for cluster if missing
  command: ssh-keygen -t ed25519 -N "" -f /etc/xcat/sshkeys/root
  args:
    creates: /etc/xcat/sshkeys/root

# IMPORTANT: slurp reads the file at runtime, not parse time
- name: Read public key for injection
  slurp:
    src: /etc/xcat/sshkeys/root.pub
  register: ssh_pubkey_raw

- name: Decode public key
  set_fact:
    ssh_public_key: "{{ ssh_pubkey_raw.content | b64decode }}"


###############################################################################
# SSH authorized_keys injection script (template-based)
###############################################################################

- name: Create authorized_keys postscript
  template:
    src: authorized-keys.sh.j2
    dest: "/install/postscripts/config/authorized-keys.sh"
    owner: root
    group: root
    mode: "0755"


###############################################################################
# DNS configuration script
###############################################################################

- name: Create DNS setup postscript
  copy:
    dest: "/install/postscripts/config/dns-setup.sh"
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      > /etc/resolv.conf
      {% for ns in anarchy_dns_forwarders %}
      echo "nameserver {{ ns }}" >> /etc/resolv.conf
      {% endfor %}
      echo "search {{ anarchy_domain }}" >> /etc/resolv.conf
      exit 0


###############################################################################
# Timezone configuration script
###############################################################################

- name: Create timezone setup postscript
  copy:
    dest: "/install/postscripts/config/timezone-setup.sh"
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/bin/bash
      timedatectl set-timezone "{{ timezone }}"
      exit 0


###############################################################################
# Root password script (dummy no-op for SSH-key-only clusters)
###############################################################################

- name: Create root password postscript (no-op)
  template:
    src: root-password.sh.j2
    dest: "/install/postscripts/config/root-password.sh"
    owner: root
    group: root
    mode: "0755"


###############################################################################
# Register the list of postscripts for use in define_image.yml
###############################################################################

- name: Register postinstall scripts list
  set_fact:
    xcat_postinstall_scripts: >
      /install/postscripts/config/authorized-keys.sh,
      /install/postscripts/config/dns-setup.sh,
      /install/postscripts/config/timezone-setup.sh,
      /install/postscripts/config/root-password.sh
