---
# handler file for xcat

- name: restart xinetd
  service:
    name: xinetd
    state: restarted

- name: restart dhcpd
  service:
    name: dhcpd
    state: restarted

- name: restart nginx
  service:
    name: nginx
    state: restarted

- name: restart named
  service:
    name: named
    state: restarted

# Removed vendor-specific luna2-daemon handler

- name: reload firewalld
  service:
    name: firewalld
    state: reloaded

- name: fix firewall zones
  shell: /tmp/fix-firewalld-zones.sh
  ignore_errors: true
  listen: reload firewalld
