---
# AlmaLinux 10 defaults for xCAT-based provisioning

provisioning_required_packages:
  - xcat-server
  - xcat-client
  - xcat-genesis-base-x86_64
  - xcat-genesis-scripts-x86_64

provisioning_enable_services:
  - xcatd

provisioning_start_services:
  - xcatd

xcat_install_dir: "/opt/xcat"
xcat_config_dir: "/etc/xcat"
xcat_bin: "/opt/xcat/bin"
xcat_sbin: "/opt/xcat/sbin"

dhcp_service_name: "dhcpd"
tftp_service_name: "tftp"
http_service_name: "httpd"

provisioning_network:
  name: "provnet"
  device: "eth0"
  ipaddr: "10.141.255.254"
  netmask: "255.255.0.0"
  network: "10.141.0.0"
  broadcast: "10.141.255.255"
  gateway: ""

xcat_nodes: []
xcat_osimages: []
xcat_groups: []
