---
# SUSE-specific repository URLs
xcat_core_repo_url: "https://xcat.org"
xcat_dep_repo_url: "https://xcat.org/files/xcat/repos/yum/devel/xcat-dep/sles15/x86_64/"

# Provisioning binaries
provisioning_required_packages:
  - xcat-server
  - xcat-client
  - xcat-genesis-base-x86_64
  - xcat-genesis-scripts-x86_64
  - conserver-xcat
  - ipmitool

# Services managed by the xCAT role
provisioning_enable_services:
  - xcatd

provisioning_start_services:
  - xcatd

# Directory layout
xcat_install_dir: "/opt/xcat"
xcat_config_dir: "/etc/xcat"
xcat_bin: "/opt/xcat/bin"
xcat_sbin: "/opt/xcat/sbin"

# Sub-services used by xCAT (Infrastructure)
dhcp_service_name: "dhcpd"
tftp_service_name: "tftp"
# We reference this from the Apache role or define it locally as a pointer
http_service_name: "apache2"

# Provisioning network
provisioning_network:
  name: "provnet"
  device: "eth0"
  ipaddr: "10.141.255.254"
  netmask: "255.255.0.0"
  network: "10.141.0.0"
  broadcast: "10.141.255.255"
  gateway: ""

xcat_nodes: []
xcat_osimages: []
xcat_groups: []
