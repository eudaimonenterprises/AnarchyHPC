---
- hosts: localhost
  pre_tasks:
    - name: Set image name
      set_fact:
        image_name: "compute-image"
      tags: always

- import_playbook: imports/anarchy-redhat-image-create.yml
  vars:
    image_name: "{{ hostvars['localhost']['image_name'] }}"
    image_password:

- import_playbook: imports/anarchy-redhat-image-setup.yml
  vars:
    hostlist: "{{ hostvars['localhost']['image_name'] }}.osimages.xcat"

- hosts:
    - "{{ hostvars['localhost']['image_name'] }}.osimages.xcat"
  roles:
    - role: anarchy/slurm
      slurm_conf_path: "{{ shared_storage_path }}/etc/slurm"
      slurm_spool_path: "{{ shared_storage_path }}/var/spool/slurm"
      munge_conf_path: "{{ shared_storage_path }}/etc/munge"
      tags: slurm

- hosts: controllers
  roles:
    - role: anarchy/osimage-pack
      vars:
        image_name: "{{ hostvars['localhost']['image_name'] }}"
      tags: pack-images
